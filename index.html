<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Over/Under Test Lab</title>
<meta name="description" content="FILM 393 · Step-by-step designer for the over/under exposure test: build your ladder, meter it, log it, analyze it.">
<style>
:root{
  --bg:#f5f2ec; --paper:#ffffff; --ink:#1d1b18; --muted:#6a655c; --line:#d8d2c6; --soft:#eeeae2;
  --accent:#a8431d; --accent-soft:#f6e3d9; --ok:#2b7a4b; --ok-soft:#dff0e5; --bad:#b3261e; --bad-soft:#f8dedb;
  --warn:#8a5a00; --warn-soft:#f7ecd0; --blue:#2c5a96; --blue-soft:#dde7f4;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151412; --paper:#1f1d1a; --ink:#efebe3; --muted:#a59f93; --line:#3b3832; --soft:#2a2824;
    --accent:#e57f52; --accent-soft:#3a261c; --ok:#63c28a; --ok-soft:#1d3326; --bad:#f07268; --bad-soft:#3d1f1c;
    --warn:#e0b14a; --warn-soft:#3a2f16; --blue:#86b0e8; --blue-soft:#1c2a3d;
  }
}
:root[data-theme="dark"]{
  --bg:#151412; --paper:#1f1d1a; --ink:#efebe3; --muted:#a59f93; --line:#3b3832; --soft:#2a2824;
  --accent:#e57f52; --accent-soft:#3a261c; --ok:#63c28a; --ok-soft:#1d3326; --bad:#f07268; --bad-soft:#3d1f1c;
  --warn:#e0b14a; --warn-soft:#3a2f16; --blue:#86b0e8; --blue-soft:#1c2a3d;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--sans)}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:16px;padding:10px 20px}
.top .brand{font:600 12px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase}
.top .brand b{color:var(--accent)}
.top .grp{margin-left:auto;font:13px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.top button{flex:none}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px;margin:0 auto}
nav.steps{position:sticky;top:50px;align-self:start;padding:20px 12px 40px 20px;max-height:calc(100vh - 50px);overflow:auto}
nav.steps ol{list-style:none;margin:0;padding:0}
nav.steps li button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%;padding:7px 8px;border-radius:6px;font-size:14.5px;line-height:1.3;color:var(--muted);box-sizing:border-box}
nav.steps li button:hover{background:var(--soft);color:var(--ink)}
nav.steps li button:focus-visible{outline:2px solid var(--accent)}
nav.steps li.on button{background:var(--ink);color:var(--paper)}
nav.steps .n{font:12px/1.5 var(--mono);min-width:20px}
nav.steps .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex:none;margin-top:5px}
nav.steps .dot.done{background:var(--ok);border-color:var(--ok)}
main{padding:28px 32px 80px;min-width:0}
.eyebrow{font:12px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:42px;line-height:1.05;margin-bottom:12px}
h1 em,h2 em{font-style:italic}
h2{font-size:30px;line-height:1.15;margin:34px 0 10px}
h3{font-size:21px;margin:24px 0 8px}
p{margin:0 0 14px;max-width:70ch}
.lead{font-size:19px;max-width:62ch}
.rule{border:0;border-top:1px solid var(--line);margin:26px 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin:16px 0}
.card.soft{background:var(--soft)}
.card.key{border:2px solid var(--ink)}
.label{font:11.5px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:block}
.why{background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:0 8px 8px 0;padding:14px 18px;margin:16px 0}
.why .label{color:var(--blue)}
.orig{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:16px 0}
.orig .label{color:var(--accent)}
.orig .big{font:21px/1.3 var(--serif);margin:0 0 8px}
.warn{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0}
.bad{background:var(--bad-soft);border-left:4px solid var(--bad);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0}
.good{background:var(--ok-soft);border-left:4px solid var(--ok);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0}
details{margin:12px 0}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
details[open] summary{margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-weight:600;font-size:15px}
.field small,.hint{color:var(--muted);font-size:13.5px;line-height:1.4}
input[type=text],input[type=number],select,textarea{font:16px var(--sans);color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:7px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:84px;resize:vertical}
input.sm,select.sm{padding:6px 7px;font-size:14.5px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok);flex:none}
.btn{font:600 15px var(--sans);border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;padding:9px 16px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:var(--line)}
.btn.small{padding:5px 10px;font-size:13.5px}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.tbl-wrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.rung{font:600 15px var(--mono);white-space:nowrap}
tr.isN td{background:var(--accent-soft)}
tr.half td.rung{color:var(--muted)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.how{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:3px}
.pill{display:inline-block;font:600 12.5px/1 var(--mono);padding:5px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--soft);color:var(--muted)}
.meter{font-size:12.5px;line-height:1.35}
.big-num{font:500 44px/1 var(--serif)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .label{margin:0}
.steps-list{counter-reset:s;list-style:none;padding:0;margin:10px 0}
.steps-list>li{counter-increment:s;display:grid;grid-template-columns:38px 1fr;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.steps-list>li::before{content:counter(s,decimal-leading-zero);font:14px/1.6 var(--mono);color:var(--muted)}
.quiz-item{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.quiz-fb{grid-column:1/-1;font-size:14px;padding:8px 12px;border-radius:6px}
.quiz-fb.right{background:var(--ok-soft)}
.quiz-fb.wrong{background:var(--bad-soft)}
.roles{display:grid;gap:10px}
.role-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 40px;gap:8px;align-items:center}
.ruler{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px;margin:10px 0}
.ruler button{all:unset;cursor:pointer;height:52px;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper);box-sizing:border-box}
.ruler button.on{background:repeating-linear-gradient(45deg,var(--ink) 0 2px,transparent 2px 7px)}
.ruler button.isN{border-width:3px}
.ruler button:focus-visible{outline:3px solid var(--accent)}
.ruler-l{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px;text-align:center;font:12px var(--mono)}
.map{position:relative;border-radius:10px;overflow:hidden;background:#000;user-select:none;margin:12px 0}
.map img{display:block;width:100%;height:auto}
.map.adding{cursor:crosshair;outline:3px solid var(--accent)}
.mk{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:0;pointer-events:none}
.mk .dotn{width:22px;height:22px;border-radius:50%;background:#fff;color:#000;font:700 12px/22px var(--mono);text-align:center;border:2px solid #000;flex:none}
.mk .tag{margin-left:5px;background:rgba(0,0,0,.78);color:#fff;font:600 12.5px/1.2 var(--mono);padding:4px 7px;border-radius:5px;white-space:nowrap;border:2px solid transparent}
.mk .tag.hot{border-color:#ff6b57}
.mk .tag.cold{border-color:#6aa6ff}
.mk .tag.good{border-color:#5fd18c}
.heat td{text-align:center;font:12.5px var(--mono);white-space:nowrap;padding:6px 5px}
.heat td.lbl{text-align:left;font:600 13px var(--sans)}
.z-hot{background:var(--bad-soft);color:var(--bad)}
.z-cold{background:var(--blue-soft);color:var(--blue)}
.z-good{background:var(--ok-soft);color:var(--ok)}
.z-n{background:transparent}
.rungbar{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.rungbar button{all:unset;cursor:pointer;font:600 12.5px var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.rungbar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.tabs button{all:unset;cursor:pointer;padding:7px 12px;border:1.5px solid var(--line);border-radius:99px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.slate{font:600 13px var(--mono);white-space:nowrap}
.lint{font-size:13px;margin-top:4px}
.save-note{font:12px var(--mono);color:var(--muted)}
.hide{display:none!important}
.now{background:var(--paper);border:2px solid var(--accent);border-radius:10px;padding:16px 20px;margin:18px 0 22px}
.now .label{color:var(--accent)}
.now .doing{font:500 20px/1.35 var(--serif);margin-bottom:10px}
details.words{background:var(--soft);border-radius:10px;padding:10px 16px;margin:28px 0 0}
details.words summary{color:var(--ink)}
details.words dl{margin:6px 0 0}
details.words dt{font-weight:700;margin-top:10px}
details.words dd{margin:2px 0 0;color:var(--muted);font-size:15px}
details.howto{margin:6px 0 0;font-size:14.5px;color:var(--ink)}
details.howto summary{font-size:14px}
details.howto>div{background:var(--soft);border-radius:8px;padding:10px 14px}
details.howto ol{margin:0;padding-left:20px}
details.howto li{margin:4px 0}
dialog#gloss{max-width:720px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:0}
dialog#gloss::backdrop{background:rgba(0,0,0,.45)}
dialog#gloss .gh{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
dialog#gloss dl{padding:6px 20px 20px;margin:0}
dialog#gloss dt{font-weight:700;margin-top:14px}
dialog#gloss dd{margin:3px 0 0;color:var(--muted)}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  nav.steps{position:static;max-height:none;padding:10px 16px 0;overflow-x:auto}
  nav.steps ol{display:flex;gap:6px;width:max-content}
  nav.steps li button{padding:7px 10px;border:1px solid var(--line);white-space:nowrap;width:auto}
  nav.steps .t{display:none}
  nav.steps .dot{margin:5px 0 0 0}
  main{padding:20px 16px 60px}
  .grid2,.grid3{grid-template-columns:1fr}
  h1{font-size:34px}
  h2{font-size:25px}
  .quiz-item{grid-template-columns:1fr}
  .top .grp{display:none}
}
@media print{
  .top,nav.steps,.pager,.noprint,button.btn{display:none!important}
  .wrap{display:block}
  main{padding:0}
  body{background:#fff;color:#000;font-size:12px}
  .card,.orig,.why{break-inside:avoid;border-color:#999}
  .tbl-wrap{overflow:visible;border-color:#999}
  table{font-size:11px}
  h2{font-size:20px;margin-top:18px;break-after:avoid}
  .pagebreak{break-before:page}
}
</style>

<header class="top">
  <div class="brand">FILM 393 · <b>Over/Under</b> Test Lab</div>
  <div class="grp" id="grpLabel"></div>
  <button class="btn small noprint" data-act="gloss">Word list</button>
  <button class="btn small ghost noprint" data-act="theme" aria-label="Toggle light/dark">◐</button>
</header>
<div class="wrap">
  <nav class="steps" aria-label="Steps"><ol id="nav"></ol></nav>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="gloss" aria-label="Word list"><div class="gh"><h3 style="margin:0">Word list</h3><button class="btn small" data-act="closeGloss">Close</button></div><dl id="glossList"></dl></dialog>
<input type="file" id="fileImport" accept="application/json,.json" class="hide">
<input type="file" id="fileImg" accept="image/*" class="hide">
<script>
"use strict";
/* ============================================================
   STOP MATH
   Iris position is stored as "s" = stops from T1 (T1=0, T1.4=1, T2=2, T2.8=3 …).
   Bigger s = smaller opening = less light.
   Exposure time t = shutter angle / 360 / fps.
   Offset of a rung from N = log2(t/t0) + (doubles at N − doubles now) + (sN − s).
   ============================================================ */
const RUNGS=[5,4,3,2,1.5,1,0.5,0,-0.5,-1,-1.5,-2,-3,-4,-5];
const FULL=[1,1.4,2,2.8,4,5.6,8,11,16,22,32,45,64];
const THIRDS=[1,1.1,1.2,1.4,1.6,1.8,2,2.2,2.5,2.8,3.2,3.5,4,4.5,5,5.6,6.3,7.1,8,9,10,11,13,14,16,18,20,22,25,29,32];
const EIS=[100,125,160,200,250,320,400,500,640,800,1000,1280,1600,2000,2500,3200,4000,5000,6400,8000,10000,12800];
const EPS=1e-6;
const log2=Math.log2;

function tToS(T){
  T=Number(T); if(!(T>0)) return null;
  for(let i=0;i<FULL.length;i++) if(Math.abs(FULL[i]-T)/T<0.04) return i;
  for(let i=0;i<THIRDS.length;i++) if(Math.abs(THIRDS[i]-T)/T<0.025) return i/3;
  return 2*log2(T);
}
function fracGlyph(f){
  if(Math.abs(f)<0.08) return '';
  if(Math.abs(f-1/6)<0.05) return '⅙';
  if(Math.abs(f-5/6)<0.05) return '⅚';
  if(Math.abs(f-1/3)<0.09) return '⅓';
  if(Math.abs(f-0.5)<0.08) return '½';
  if(Math.abs(f-2/3)<0.09) return '⅔';
  return '.'+Math.round(f*10);
}
/* T-number label for an iris position, e.g. s=3 → "T2.8", s=3.333 → "T2.8 +⅓" */
function fmtT(s){
  if(s==null||isNaN(s)) return '—';
  const half=Math.abs(s*2-Math.round(s*2))<EPS && Math.abs(s-Math.round(s))>EPS;
  let base=Math.floor(s+EPS), frac=s-base;
  if(!half){ const r3=Math.round(s*3)/3; base=Math.floor(r3+EPS); frac=r3-base; if(frac>0.95){base++;frac=0;} }
  const name=base>=0&&base<FULL.length?FULL[base]:(Math.round(Math.pow(2,base/2)*10)/10);
  const g=fracGlyph(frac);
  return 'T'+name+(g?' +'+g:'');
}
/* Iris label relative to N — half stops shown as a split between two marks */
function irisLabel(s,sN){
  const d=s-sN;
  if(Math.abs(d)<EPS) return fmtT(s);
  if(Math.abs(Math.abs(d)-Math.round(Math.abs(d)))<EPS) return fmtT(s);
  const lo=sN+Math.trunc(d), hi=lo+Math.sign(d);
  const a=[fmtT(Math.min(lo,hi)),fmtT(Math.max(lo,hi))];
  return a[0]+' / '+a[1].replace('T','')+' split';
}
/* Stops as signed text: 1.5 → "+1½" */
function fmtStops(x,withSign=true){
  const sign=x>EPS?'+':(x<-EPS?'−':'');
  let a=Math.abs(x), w=Math.floor(a+EPS), f=a-w;
  let g=fracGlyph(f); if(Math.abs(f-1)<0.08){w++;g='';}
  let body=(w||!g?String(w):'')+g;
  if(body==='0') return '0';
  return (withSign?sign:'')+body;
}
/* Offset label: 0 → "N", 1.5 → "N+1½", -2 → "N−2" */
function fmtO(o){
  if(o==null||isNaN(o)) return '—';
  if(Math.abs(o)<0.08) return 'N';
  return 'N'+fmtStops(o);
}
function fmtAng(a){ return (Math.abs(a-Math.round(a))<0.01?Math.round(a):Math.round(a*100)/100)+'°'; }
function fmtFps(F){ return String(Math.round(F*1000)/1000); }
function fmtDen(den){ return '1/'+(den<10?Math.round(den*10)/10:Math.round(den)); }
const STD_DEN=[1,2,3,4,6,8,12,15,24,25,30,40,48,50,60,80,96,100,120,125,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500,3200,4000,5000,6400,8000,10000,12800,16000];
function nearDen(den){ let b=STD_DEN[0]; for(const d of STD_DEN) if(Math.abs(log2(d/den))<Math.abs(log2(b/den))) b=d; return b; }

/* Parse a meter reading: "2.8", "T4", "2.8 2/3", "2.8+1/3", "2.8 7" (Sekonic tenths), "5.6½" */
function parseReading(str){
  if(str==null) return null;
  let t=String(str).trim().toLowerCase().replace(/^[tf]\s*\/?\s*/,'')
    .replace('⅓',' 1/3').replace('⅔',' 2/3').replace('½',' 1/2').replace(/\s+/g,' ').trim();
  if(!t) return null;
  let m=t.match(/^(\d+(?:\.\d+)?)\s*(?:\+\s*)?(?:(\d)\s*\/\s*(\d))?$/);
  let base,frac=0;
  if(m){ base=parseFloat(m[1]); if(m[2]) frac=Number(m[2])/Number(m[3]); }
  else{
    m=t.match(/^(\d+(?:\.\d+)?)(?:\s*\+\s*|\s+)\.?(\d)$/);
    if(!m) return null;
    base=parseFloat(m[1]); frac=Number(m[2])/10;
  }
  const s=tToS(base); if(s==null) return null;
  return s+frac;
}
function snapEI(v){ let best=EIS[0]; for(const e of EIS) if(Math.abs(log2(e/v))<Math.abs(log2(best/v))) best=e; return best; }
const rk=o=>'r'+Math.round(o*2);

/* ============================================================
   STATE
   ============================================================ */
const KEY='film393-overunder-lab-v1';
function fresh(){
  return {
    step:0,
    group:{name:'',section:'',date:'',members:[{name:'',role:''},{name:'',role:''},{name:'',role:''}]},
    quiz:{}, apparatus:{},
    cam:{name:'',ei:800,profiles:'',shutterMode:'angle',angleMode:'list',angles:'',minA:11.25,maxA:360,fastest:8000,
         fps:24,minF:6,maxF:60,lens:'',focal:'',wide:'1.5',deep:'22',wb:3200,doubles:4,singles:1,playSec:10,headroom:3},
    N:null,
    base:{auto:true,A0:180,D0:0,G0:0},
    edits:{},
    setup:{key:'',fill:'',bg:'',hair:'',dist:'',fixture:'',notes:''},
    checklist:{},
    map:{img:null,markers:[],rung:0,clip:'',floor:''},

   CAMERA PARAMS + LADDER SOLVER

function angleList(c){
  const xs=String(c.angles||'').split(/[,\s]+/).map(x=>parseFloat(x.replace('°',''))).filter(x=>x>0&&x<=360+EPS);
  return [...new Set(xs.map(x=>Math.round(x*1000)/1000))].sort((a,b)=>a-b);
}
function P(){
  const c=S.cam, F0=Number(c.fps)||24;
  const speed=c.shutterMode==='speed';
  const sWide=tToS(c.wide)??0, sDeep=tToS(c.deep)??9;
  const list=(!speed&&c.angleMode!=='any')?angleList(c):[];
  const aList=list.length?list:null;
  return {
    speed, F0, aList,
    minA: speed? 360*F0/(Number(c.fastest)||8000) : aList? aList[0] : (Number(c.minA)||11.25),
    maxA: speed? 360 : aList? aList[aList.length-1] : 360,
    minF: Math.min(Number(c.minF)||F0,F0), maxF: Math.max(Number(c.maxF)||F0,F0),
    Dmax: Math.max(0,Math.round(Number(c.doubles)||0)),
    Gmax: Math.max(0,Math.round(Number(c.singles)||0)),
    sWide:Math.min(sWide,sDeep), sDeep:Math.max(sWide,sDeep),
    sN: S.N==null? null : Number(S.N),
    playSec:Number(c.playSec)||10,
    fastest: speed? (Number(c.fastest)||8000) : Infinity,
    headroom: c.headroom===''||c.headroom==null?3:Number(c.headroom)
  };
}
/* One take. Order of tools, per class rules: shutter angle → scrims → frame rate → lens (last resort).
   Half-stops: shutter angle if the camera has that exact angle → single scrim → lens split (last resort). */
function solveRung(o,A0,D0,G0,p){
  let s=p.sN,k=0,F=p.F0,D=D0,G=G0,ok=true;
  const aOK=(kk,FF=F)=>{const a=A0*Math.pow(2,kk);
    if(a<p.minA-EPS||a>p.maxA+EPS||a/360/FF<1/p.fastest-1e-12) return false;
    if(p.aList&&!p.aList.some(x=>Math.abs(x-a)/a<0.006)) return false;
    return true;};
  const whole=Math.trunc(o), half=o-whole;
  if(Math.abs(half)>EPS){
    const h=Math.sign(half)*0.5; let done=false;
    if(aOK(k+h)){k+=h;done=true;}
    if(!done&&h>0&&G>0){G--;done=true;}
    if(!done&&h<0&&G<p.Gmax){G++;done=true;}
    if(!done&&h<0&&G>0&&D<p.Dmax){D++;G--;done=true;}   /* swap single → double = −½ */
    if(!done&&h>0&&D>0&&G<p.Gmax){D--;G++;done=true;}   /* swap double → single = +½ */
    if(!done&&s-h>=p.sWide-EPS&&s-h<=p.sDeep+EPS){s-=h;done=true;}
    if(!done) ok=false;
  }
  let r=whole;
  while(r>0&&aOK(k+1)){k++;r--;}
  while(r>0&&D>0){D--;r--;}
  while(r>0&&F/2>=p.minF-EPS){F/=2;r--;}
  while(r>0&&s-1>=p.sWide-EPS){s-=1;r--;}
  while(r<0&&aOK(k-1)){k--;r++;}
  while(r<0&&D<p.Dmax){D++;r++;}
  while(r<0&&F*2<=p.maxF+EPS&&aOK(k,F*2)){F*=2;r++;}
  while(r<0&&s+1<=p.sDeep+EPS){s+=1;r++;}
  if(r!==0) ok=false;
  return {o,s,angle:A0*Math.pow(2,k),F,D,G,ok};
}
function ladderCost(A0,D0,G0,p){
  let cost=0; const rows=RUNGS.map(o=>solveRung(o,A0,D0,G0,p));
  for(const r of rows){
    if(!r.ok) cost+=1000;
    cost+=3*Math.abs(log2(r.F/p.F0));
    cost+=20*Math.abs(r.s-p.sN);
    cost+=0.5*Math.abs(r.D-D0)+0.4*Math.abs(r.G-G0);
  }
  const light=log2(180/A0)+D0+0.5*G0;
  cost+=1.0*Math.max(0,light)+0.3*Math.abs(log2(A0/180));
  return {cost,rows};
}
function baseCandidates(p){
  if(p.aList) return p.aList.slice().reverse();
  return [360,180,90,45,22.5,11.25,5.625].filter(a=>a>=p.minA-EPS&&a<=p.maxA+EPS);
}
function autoBase(p){
  let best=null;
  const cands=[];
  for(const A0 of baseCandidates(p)) for(let D0=0;D0<=p.Dmax;D0++) for(let G0=0;G0<=Math.min(1,p.Gmax);G0++) cands.push({A0,D0,G0,light:log2(180/A0)+D0+0.5*G0});
  let pool=cands.filter(c=>c.light<=p.headroom+EPS);
  if(!pool.length){ const m=Math.min(...cands.map(c=>c.light)); pool=cands.filter(c=>c.light<=m+EPS); }
  for(const {A0,D0,G0} of pool){
    const c=ladderCost(A0,D0,G0,p);
    if(!best||c.cost<best.cost-1e-9) best={A0,D0,G0,cost:c.cost};
  }
  return best||{A0:180,D0:0,G0:0,cost:0};
}
function getBase(p){
  if(S.base.auto){ const b=autoBase(p); return {A0:b.A0,D0:b.D0,G0:b.G0}; }
  return {A0:Number(S.base.A0)||180,D0:Math.min(p.Dmax,Number(S.base.D0)||0),G0:Math.min(p.Gmax,Number(S.base.G0)||0)};
}
/* Final ladder = solver suggestion + any cell the group edited by hand */
function ladder(){
  const p=P(); if(p.sN==null) return null;
  const b=getBase(p);
  const rows=RUNGS.map(o=>{
    const r=solveRung(o,b.A0,b.D0,b.G0,p); const e=S.edits[rk(o)]||{};
    const row={o,s:r.s,angle:r.angle,F:r.F,D:r.D,G:r.G,ok:r.ok,edited:false};
    if(e.s!=null&&e.s!==''){row.s=Number(e.s);row.edited=true;}
    if(e.F!=null&&e.F!==''){row.F=Number(e.F);row.edited=true;}
    if(e.D!=null&&e.D!==''){row.D=Number(e.D);row.edited=true;}
    if(e.G!=null&&e.G!==''){row.G=Number(e.G);row.edited=true;}
    if(p.speed){
      row.den=360*r.F/r.angle;
      if(e.den!=null&&e.den!==''){row.den=Number(e.den);row.edited=true;}
      row.t=1/row.den; row.angle=360*row.F*row.t;
    }else{
      if(e.angle!=null&&e.angle!==''){row.angle=Number(e.angle);row.edited=true;}
      row.t=row.angle/360/row.F;
    }
    return row;
  });
  const t0=b.A0/360/p.F0;
  for(const r of rows){
    const lightStops=(b.D0-r.D)+0.5*(b.G0-r.G);
    r.actual=log2(r.t/t0)+lightStops+(p.sN-r.s);
    r.meterRec=p.sN+log2(r.t/t0)+lightStops;
    r.incident=p.sN+lightStops;
    r.scrimChange=Math.abs(lightStops)>EPS||r.D!==b.D0||r.G!==b.G0;
    r.irisMoved=Math.abs(r.s-p.sN)>EPS;
    r.rec=Math.round(p.playSec*p.F0/r.F);
    r.problems=[];
    if(!p.speed&&p.aList&&!p.aList.some(x=>Math.abs(x-r.angle)/r.angle<0.006)) r.problems.push(fmtAng(r.angle)+' isn’t on your camera’s shutter-angle list (Camera step).');
    if(r.G>p.Gmax||r.G<0) r.problems.push('You only have '+p.Gmax+' single scrim'+(p.Gmax===1?'':'s')+' (from the Camera step).');
    if(r.t>1/r.F+1e-9) r.problems.push('Impossible: the shutter can’t stay open longer than one whole frame (360°, which is '+fmtDen(r.F)+' of a second at '+fmtFps(r.F)+' frames per second).');
    if(!p.speed&&(r.angle<p.minA-EPS||r.angle>p.maxA+EPS)) r.problems.push('Your camera’s shutter angle only goes from '+fmtAng(p.minA)+' to '+fmtAng(p.maxA)+'.');
    if(p.speed&&r.den>p.fastest*1.02) r.problems.push('Faster than your camera’s fastest shutter speed (1/'+p.fastest+' of a second).');
    if(r.F<p.minF-EPS||r.F>p.maxF+EPS) r.problems.push('Your camera’s frame rate only goes from '+fmtFps(p.minF)+' to '+fmtFps(p.maxF)+' frames per second.');
    if(r.s<p.sWide-EPS||r.s>p.sDeep+EPS) r.problems.push('That T-stop isn’t on your lens.');
    if(r.D>p.Dmax||r.D<0) r.problems.push('You only have '+p.Dmax+' double scrim'+(p.Dmax===1?'':'s')+' (from the Camera step).');
    if(!r.edited&&!r.ok) r.problems.push('Your camera settings can’t reach this take. On the Camera step, widen a range or add scrims.');
    r.match=Math.abs(r.actual-r.o)<0.09;
    r.how=howText(r,b,p);
    r.slate=[fmtO(r.o),irisLabel(r.s,p.sN).replace(' split',' (split)'),(p.speed?fmtDen(r.den):fmtAng(r.angle))+' shutter',fmtFps(r.F)+' fps',(r.D||r.G)?[r.D?r.D+' double'+(r.D>1?'s':''):'',r.G?r.G+' single'+(r.G>1?'s':''):''].filter(Boolean).join(' + '):'no scrims'].join(' · ');
  }
  return {rows,base:b,p,t0};
}
function howText(r,b,p){
  const parts=[];
  if(p.speed){ const d0=360*p.F0/b.A0; if(Math.abs(log2(r.den/d0))>0.02) parts.push((r.den<d0?'slower':'faster')+' shutter speed '+fmtDen(d0)+' → '+fmtDen(r.den)+' ('+stopWord(log2(d0/r.den))+')'); }
  else if(Math.abs(r.angle-b.A0)>0.01) parts.push((r.angle>b.A0?'open':'close')+' the shutter angle '+fmtAng(b.A0)+' → '+fmtAng(r.angle)+' ('+stopWord(log2(r.angle/b.A0))+')');
  if(Math.abs(r.F-p.F0)>EPS) parts.push('frame rate '+fmtFps(p.F0)+' → '+fmtFps(r.F)+' frames per second'+(p.speed?(r.F<p.F0?' (so the shutter can stay open longer)':' (so the shutter can be faster)'):' ('+stopWord(log2(p.F0/r.F))+')'));
  const dD=b.D0-r.D;
  if(dD>0) parts.push('pull out '+dD+' double scrim'+(dD>1?'s':'')+' ('+stopWord(dD)+')');
  if(dD<0) parts.push('add '+(-dD)+' more double scrim'+(dD<-1?'s':'')+' ('+stopWord(dD)+')');
  const dG=b.G0-r.G;
  if(dG>0) parts.push('pull out '+dG+' single scrim'+(dG>1?'s':'')+' ('+stopWord(dG/2)+')');
  if(dG<0) parts.push('add '+(-dG)+' single scrim'+(dG<-1?'s':'')+' ('+stopWord(dG/2)+')');
  const dI=p.sN-r.s;
  if(Math.abs(dI)>EPS) parts.push('⚠︎ '+(dI>0?'open':'close')+' the lens '+fmtStops(Math.abs(dI),false)+' stop'+(Math.abs(Math.abs(dI)-0.5)<EPS?' by setting the ring halfway between two marks':'')+' ('+fmtStops(dI)+')');
  return parts.length?parts.join(' · '):'starting settings — this is N, your normal exposure';
}
function stopWord(x){ return fmtStops(x)+(Math.abs(x)>1+EPS?' stops':' stop'); }
/* How much light a rung gets compared to N, in words a 10th grader can picture */
function mult(o){
  if(Math.abs(o)<0.08) return 'normal exposure';
  const m=Math.pow(2,Math.abs(o)); const n=Math.abs(m-Math.round(m))<0.05?String(Math.round(m)):(Math.round(m*10)/10).toString();
  return o>0?`${n}× the light`:`1/${n} of the light`;
}
function plainO(o){
  if(Math.abs(o)<0.08) return 'normal exposure';
  return `${fmtStops(Math.abs(o),false)} stop${Math.abs(Math.abs(o)-1)<0.05||Math.abs(o)<1?'':'s'} ${o>0?'brighter':'darker'} · ${mult(o)}`;
}

const WORDS={
  stop:['Stop','One step of light. +1 stop means twice as much light. −1 stop means half as much. Everything in this test is counted in stops.'],
  N:['N (normal exposure)','The exposure you actually plan to shoot your film at. Every take is named by how far it is from N. N+2 is 2 stops brighter (4× the light). N−1 is 1 stop darker (half the light).'],
  ladder:['Exposure ladder','The same shot recorded 15 times, each one a set number of stops brighter or darker than N, like the rungs of a ladder. Watching where the picture breaks tells you what your camera can handle.'],
  rung:['Rung / take','One recording in the ladder, for example the N+2 take.'],
  tstop:['T-stop','The number on a cinema lens ring that controls how much light gets through. A smaller number (T2) lets in more light and a bigger number (T8) less. Each full mark (1.4, 2, 2.8, 4, 5.6, 8, 11, 16, 22) is exactly one stop apart.'],
  iris:['Iris','The opening inside the lens that you set with the T-stop ring.'],
  split:['Split (half-stop)','Setting the lens ring exactly halfway between two marks, like between T2 and T2.8. That’s half a stop.'],
  dof:['Depth of field','How much of the picture, from front to back, is in sharp focus. Changing the T-stop changes it, which is one reason we keep the lens at N.'],
  shutter:['Shutter angle','How long each frame is exposed, written in degrees. 180° is normal. 360° exposes twice as long (+1 stop) and 90° half as long (−1 stop).'],
  speed:['Shutter speed','The same idea as shutter angle, written as a fraction of a second (1/48). Some cameras use this instead of degrees.'],
  fps:['Frame rate (frames per second, fps)','How many pictures the camera records each second. 24 is normal. Recording 12 per second at the same shutter angle exposes each picture twice as long: +1 stop.'],
  sensorfps:['Sensor frame rate','How many frames the sensor actually captures per second. This is what changes exposure. In slow-motion menus it’s sometimes called “S&Q” (slow and quick) or “off-speed.”'],
  ei:['Exposure Index (EI) / ISO','The sensitivity number you set on the camera and on the meter. They must match. The camera’s “native” or “base” ISO is the setting it was designed around.'],
  rerate:['Re-rating','Choosing a different EI than the native one on purpose, to protect bright areas or dark areas.'],
  tungsten:['Tungsten light','A classic lamp with a glowing metal filament. Its color is warm, about 3200 Kelvin.'],
  single:['Single / double scrim','Scrim bags are color-coded: a double usually has a red rim and cuts about 1 stop. A single usually has a green rim and cuts about ½ stop. Real scrims vary a little, so you check each one with the meter.'],
  scrim:['Scrim','A wire-mesh screen that slides into the front of a light. A double cuts about 1 stop and a single about ½ stop. Scrims make the light dimmer without changing its color or direction.'],
  dimmer:['Dimmer','Turning the power down. On a tungsten light this makes the light more orange, which adds a second change to the test. We don’t use it.'],
  bead:['Bead board','A white foam board you bounce light off to make it softer.'],
  kelvin:['Kelvin (K) / white balance','Kelvin is the color of light. Tungsten is about 3200K. White balance tells the camera that color, so white looks white. We lock it so it can’t change.'],
  meter:['Light meter (Sekonic Speedmaster)','A handheld tool that measures light and tells you which T-stop gives a correct exposure for the settings you type in.'],
  incident:['Incident reading','Holding the meter at the actor with its white dome pointed at the camera. It measures the light arriving at the actor.'],
  spot:['Spot reading','Looking through the meter’s small viewfinder at one surface (skin, a shirt, a wall). It tells you how bright that one surface is.'],
  grey:['Grey card (middle grey)','A card that reflects exactly 18% of the light. It’s the “average” brightness the meter and camera are built around, so it’s our reference.'],
  waveform:['Waveform','A graph on the monitor showing how bright every part of the picture is, from 0 (black) at the bottom to 100 (white) at the top.'],
  ire:['IRE','The units on the waveform’s 0–100 brightness scale. A grey card lit correctly sits around 40–45 IRE.'],
  clip:['Clip / clipping','When something is too bright for the sensor, it records as flat white and the detail is gone forever. On the waveform it looks like a flat line at the top.'],
  noise:['Noise / noise floor','The grainy, crawling speckle in dark areas. The noise floor is the point where shadows turn into nothing but noise.'],
  dr:['Dynamic range','How many stops the sensor can record between clipping and the noise floor. The manufacturer measures this in a lab.'],
  latitude:['Latitude','How many stops over and under N you can shoot and still fix in color grading. This is what your test measures, and it’s your judgment, so say what standard you used.'],
  profile:['Recording profile','The “look curve” the camera records with. Rec709 looks like normal TV and is ready to watch. Log profiles (S-Log, Canon Log, LogC…) look flat and grey but save more range for color grading.'],
  grade:['Color grading / colorist','Adjusting brightness and color after the shoot. The colorist is the person who does it.'],
  onelight:['One light','One single color correction, set on the N take and copied unchanged onto every take. It shows exactly what the sensor did.'],
  bestlight:['Best light','Each take corrected on its own, as far as it can go. It shows how much you can rescue in grading.'],
  rolloff:['Highlight roll-off','How gently bright areas fade into white. Smooth roll-off looks natural; harsh roll-off looks like a hard cut to white.'],
  variables:['Controlled / independent / dependent','Controlled: things you keep the same. Independent: the one thing you change on purpose. Dependent: what you watch for changes.'],

  {t:'Shoot the ladder',f:stepShoot,done:()=>profiles().some((_,i)=>RUNGS.every(o=>S.takes['p'+i]?.[rk(o)]?.shot))},
  {t:'Review 1: one light',f:stepOneLight,done:()=>profiles().some((_,i)=>S.analysis['p'+i]?.hi)},
  {t:'Review 2: best light',f:stepBestLight,done:()=>profiles().some((_,i)=>S.analysis['p'+i]?.overRec)},
  {t:'Compare profiles & EI',f:stepProfiles,done:()=>Object.values(S.profileCmp||{}).some(v=>v&&v.verdict)},
  {t:'Write your on-set rules',f:stepRules,done:()=>(S.rules||[]).filter(Boolean).length>=3},
  {t:'Print & save your packet',f:stepPacket,done:()=>false},
];

/* ---------- helpers for markup ---------- */
function inp(path,{type='text',ph='',cls='',r=false,attrs=''}={}){
  const v=getP(path);
  return `<input type="${type}" ${type==='number'?'step="any" inputmode="decimal"':''} class="${cls}" data-bind="${path}" ${type==='number'?'data-num="1"':''} ${r?'data-r="1"':''} value="${esc(v??'')}" placeholder="${esc(ph)}" ${attrs}>`;
}
function sel(path,opts,{r=true,cls='',num=false}={}){
  const v=getP(path);
  return `<select class="${cls}" data-bind="${path}" ${r?'data-r="1"':''} ${num?'data-num="1"':''}>${opts.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(lab)}</option>`;}).join('')}</select>`;
}
function field(label,control,hint=''){ return `<label class="field"><span>${label}</span>${control}${hint?`<small>${hint}</small>`:''}</label>`; }
function chk(path,text){ return `<label class="check"><input type="checkbox" data-bind="${path}" data-r="1" ${getP(path)?'checked':''}><span>${text}</span></label>`; }
function why(title,body){ return `<div class="why"><span class="label">${title}</span>${body}</div>`; }
function orig(body){ return `<div class="orig"><span class="label">Example: the original F3 camera test</span>${body}</div>`; }
function head(n,title,lead){ return `<p class="eyebrow">Step ${String(n).padStart(2,'0')} of ${STEPS.length-1} · ${esc(STEPS[n].t)}</p><h1>${title}</h1>${lead?`<p class="lead">${lead}</p>`:''}`; }
function profTabs(){
  const ps=profiles(), c=curProf();
  if(ps.length<2) return `<p class="hint">Recording profile: <b>${esc(ps[0])}</b></p>`;
  return `<div class="tabs" role="tablist">${ps.map((p,i)=>`<button role="tab" aria-selected="${i===c}" class="${i===c?'on':''}" data-act="prof" data-arg="${i}">${esc(p)}</button>`).join('')}</div><p class="hint">You shoot the same ladder once for each recording profile. Click a profile’s name above and fill this page in for each one.</p>`;
}
function rungOpts(sign,none='— not decided yet —'){
  const list=RUNGS.filter(o=>sign>0?o>0:sign<0?o<0:true);
  return [['',none],...list.map(o=>[String(o),`${fmtO(o)}  (${plainO(o)})`]),['none',sign>0?'Never: it held all the way to N+5':sign<0?'Never: it held all the way to N−5':'Didn’t happen']];
}
function needN(){ return `<div class="warn">First fill in the Camera step and choose N, your normal stop. <button class="btn small" data-act="go" data-arg="3">Go to Choose N</button></div>`; }

/* ---------- STEP 0 · GROUP ---------- */
const ROLES=['Director of Photography (DP): sets N and judges the monitor','First Assistant Camera (1st AC): sets the lens, shutter and frame rate for each take','Gaffer: the only person who touches the light and scrims','Meter & log: takes meter readings and fills in the take log','Second Assistant Camera (2nd AC): slates every take and calls how long to roll'];

   <p class="hint" style="margin:0">Every step starts with a <b>“What are we doing now?”</b> box. Any word you don’t know is in <b>Words on this page</b>, or in the <b>Word list</b> button at the top. Your work saves automatically <b>in this browser on this computer</b>. To move it to a teammate’s laptop, use <b>Export group file</b> on the last step.</p></div>

   <div class="roles">${m.map((x,i)=>`<div class="role-row">${inp(`group.members.${i}.name`,{ph:'Name'})}${sel(`group.members.${i}.role`,[['','Pick a job…'],...ROLES.map(r=>[r,r]),...((COMBOS[n]||[]).filter(c=>c.includes('+')).map(c=>[c,'Two jobs: '+c]))],{r:false})}<button class="btn small ghost" data-act="rmMember" data-arg="${i}" aria-label="Remove member">✕</button></div>`).join('')}</div>

   ${words(['roles','ladder','rung','N','stop'])}`;
}

/* ---------- STEP 1 · EXPERIMENT ---------- */
const QUIZ={

  scrim:{q:'Scrims you add or pull out between takes',a:'i',why:'Independent. A scrim is one of your tools for changing how far a take is from N. It dims the light without changing where the light comes from or its color. (The light itself stays locked in place.)'},

  ei:{q:'The camera’s Exposure Index (EI / ISO)',a:'c',why:'Controlled for the whole ladder. You might change it after the test, but then you shoot a new ladder.'},

  noise:{q:'Grainy noise in the shadows',a:'d',why:'Dependent.'},

};
const APPARATUS=['Camera + one wide-ish cinema prime lens close to the focal length of your master shots','Tungsten key light with its scrim bag (doubles + singles), bounced into a bead board','One small tungsten light to separate the background','Sekonic Speedmaster light meter: white dome for incident readings + 1° spot viewfinder','18% grey card + color chart','Calibrated monitor with a waveform','Stand-in whose skin tone matches your actors, wearing the real costume','Key fabrics in the frame to show texture','Slate + markers big enough to read in a small thumbnail','Tape measure + camera tape for marks'];
function stepExperiment(){

  `<div class="card soft"><span class="label">Why we test</span><p style="margin:0">A camera’s spec sheet tells you its <b>dynamic range</b>, measured in a lab on a test chart. But you shoot faces, fabric and lamps, through <em>your</em> lens, into <em>your</em> color grade. What matters is your <b>usable range</b> in that whole chain, and nobody can measure that for you. This test gives you the number: your <b>latitude</b>.</p></div>

  ${words(['variables','dr','latitude','tungsten','scrim','dimmer','bead','meter','grey','waveform','standin'])}`;

/* ---------- STEP 2 · CAMERA ---------- */
function stepCamera(){
  const c=S.cam, speed=c.shutterMode==='speed';
  return head(2,'Your camera, <em>your</em> lens.','Every camera is different, so the lab needs to know what yours can actually do. Have the camera on and its menus open while you fill this in.')+
  now('Telling the lab your camera’s settings and limits, your lens, and your lights.','The lab uses these limits to build a ladder of 15 takes your camera can really shoot. Wrong limits give you a plan that won’t work on the day.','every field is filled in from the real camera, lens and scrim bag, not from memory. Each question has a <b>“How do I find this?”</b> link: click it before asking for help.')+
  `<h2>Camera</h2>
  <div class="grid2">
    ${field('Camera model',inp('cam.name',{ph:'e.g. Sony FX6',r:true}))}

    ${field('Recording profiles to test',inp('cam.profiles',{ph:'e.g. S-Log3, S-Cinetone, Rec709',r:true}),'The “look curves” your camera can record with. Separate them with commas. You’ll shoot one full ladder for each.'+how('How do I find the profiles?',`<ol><li>In the menu, look for <b>Picture Profile</b>, <b>Gamma</b>, <b>Look</b>, <b>Log</b>, <b>Color</b> or <b>Custom Picture</b>.</li><li>List the ones your class will actually use. Usually that’s one log profile (S-Log3, Canon Log, BRAW Film, LogC…) and one “ready to watch” profile (Rec709, S-Cinetone…).</li><li>Type their names exactly as the camera shows them.</li></ol>`))}
    ${field('White balance (in Kelvin)',inp('cam.wb',{type:'number',ph:'3200'}),'Your key light is tungsten, so this is usually 3200. Set it by hand and turn off auto.'+how('How do I set it?',`<ol><li>Find <b>White Balance</b> in the menu (sometimes a WB button on the body).</li><li>Change it from Auto/AWB to a <b>Kelvin</b> number (sometimes called “Preset” or “Manual”) and set <b>3200</b>.</li><li>Make sure nothing says “ATW” or “Auto”.</li></ol>`))}
  </div>

  <div class="grid2">
    ${field('How does your camera show the shutter?',sel('cam.shutterMode',[['angle','In degrees (like 180°)'],['speed','As a fraction of a second (like 1/48)']]),'Switch the camera to degrees if it lets you. It makes this test much easier.'+how('How do I switch to degrees?',`<ol><li>Open the <b>Shutter</b> menu.</li><li>Look for a setting called <b>Mode</b>, <b>Angle/Speed</b> or <b>Shutter Display</b>, and choose <b>Angle</b>.</li><li>If there’s no such setting, your camera only uses speed. Choose “As a fraction of a second” here.</li></ol>`))}
    ${speed?field('Fastest shutter speed',`<div class="row" style="flex-wrap:nowrap"><span class="mono">1/</span>${inp('cam.fastest',{type:'number',ph:'8000',r:true})}</div>`,'The shortest time the camera can expose one frame. The longest is always one whole frame.'+how('How do I find it?',`<ol><li>Open the shutter setting and keep making the number bigger (1/100, 1/200, 1/500…).</li><li>When it stops going up, that’s your fastest speed. Type the bottom number.</li></ol>`))
      :field('Can you type <em>any</em> angle, or pick from a list?',sel('cam.angleMode',[['list','Pick from a list of set angles'],['any','I can type any number (like 63.6°)']]),how('How do I test this?',`<ol><li>Open the shutter-angle setting and try to change it by the smallest amount possible.</li><li>If it jumps between set values (like 45° → 90° → 144° → 172.8° → 180°), choose <b>list</b>.</li><li>If it moves in tiny steps (180.0 → 180.1…) or lets you type a number, choose <b>any number</b>.</li></ol>`))}
  </div>
  ${speed?'':(c.angleMode==='any'?`<div class="grid2">${field('Smallest angle it allows',inp('cam.minA',{type:'number',ph:'11.25',r:true}),'Turn the angle down as far as it goes and type that number.')}<div class="field"><span>Largest angle</span><div class="big-num" style="font-size:32px">360°</div><small>360° is always the maximum: the shutter is open for the whole frame.</small></div></div>`
  :`<div class="card soft">${field('Every shutter angle on your camera’s list',inp('cam.angles',{ph:'e.g. 11.25, 22.5, 45, 90, 144, 172.8, 180, 360',r:true}),'Type every value, separated by commas. 360° is always the largest.')}
    ${how('How do I find every angle? (do this with the camera on)',`<ol><li>Set the camera to shutter <b>angle</b> mode.</li><li>Turn the shutter angle down until it won’t go any lower. Write that number down.</li><li>Now click up <b>one step at a time</b>, writing down every value you see, until you reach the top.</li><li>Type the whole list here. The lab will only plan takes with angles that are on this list.</li></ol><p style="margin:0">Tip: the angles that matter most are the “doubling chain”: 11.25 → 22.5 → 45 → 90 → 180 → 360. Each step in that chain is exactly 1 stop.</p>`)}
    ${(()=>{const L=angleList(c);if(!L.length) return '<p class="hint" style="margin:0">No angles entered yet.</p>';
       const chain=[11.25,22.5,45,90,180,360].map(a=>`<span class="pill ${L.some(x=>Math.abs(x-a)<0.01)?'ok':'neutral'}">${a}°${L.some(x=>Math.abs(x-a)<0.01)?' ✓':' missing'}</span>`).join(' ');
       return `<p style="margin:10px 0 4px"><b>Your list:</b> ${L.map(a=>a+'°').join(', ')}${L[L.length-1]<360-EPS?' <span class="pill warn">360° is missing: check the top of the menu again</span>':''}</p><p class="hint" style="margin:0">Doubling chain (1 stop apart): ${chain}</p>`;})()}
  </div>`)}
  <h2>Frame rate</h2>
  <div class="grid2">
    ${field('Normal frame rate (frames per second)',sel('cam.fps',[['24','24'],['23.976','23.976'],['25','25'],['30','30']],{num:true}),'The frame rate you’ll shoot N at. 23.976 and 24 work the same for this math.')}

    ${field('Highest frame rate the sensor can record',inp('cam.maxF',{type:'number',ph:'60',r:true}),how('How do I find it?',`<ol><li>Same menu as above: raise the frame rate until it stops.</li><li>Some cameras need a smaller resolution for high frame rates. Use the highest number available <b>at the resolution you’re testing</b>.</li></ol>`))}
  </div>

  <div class="grid3">
    ${field('Lens',inp('cam.lens',{ph:'e.g. Cooke S4 32mm'}))}
    ${field('Widest T-stop (smallest number)',inp('cam.wide',{type:'number',ph:'1.5',r:true}),'Turn the lens ring all the way open and read the number at the mark.')}
    ${field('Deepest T-stop (biggest number)',inp('cam.deep',{type:'number',ph:'22',r:true}),'Turn the ring all the way closed and read the number.')}
  </div>
  <h2>Light and scrims</h2>
  <div class="grid2">
    ${field('How many <b>double</b> scrims fit your key light?',inp('cam.doubles',{type:'number',ph:'4',r:true}),'Each double cuts about 1 stop.'+how('How do I count them?',`<ol><li>Open the scrim bag that belongs to your key light (scrims only fit the light they’re made for).</li><li>Doubles usually have a <b>red</b> rim. Count the full-size ones.</li><li>Check how many the light’s scrim holder can hold at once. If it holds fewer than you have, type that smaller number.</li></ol>`))}
    ${field('How many <b>single</b> scrims fit your key light?',inp('cam.singles',{type:'number',ph:'1',r:true}),'Each single cuts about ½ stop. They make the half-stop takes, so the lens can stay at N.'+how('How do I count them?',`<ol><li>Singles usually have a <b>green</b> rim.</li><li>Count only full-size singles (not half-moon “half scrims”).</li></ol>`))}
    ${field('Extra light available (in stops)',inp('cam.headroom',{type:'number',ph:'3',r:true}),'How much brighter than a “normal” setup (180° shutter, no scrims) your tungsten key can get at the actor.'+how('How do I measure this? (5 minutes with the meter)',`<ol><li>Set the meter to your Exposure Index, ${fmtFps(Number(c.fps)||24)} frames per second and <b>180°</b>.</li><li>Put the light where you’d like it and take a dome reading at the actor’s face with no scrims. Write it down (e.g. T2.8).</li><li>Now make the light as bright as you can at the actor without changing its look much: focus (spot) the beam, or move it a little closer. Take another reading (e.g. T5.6).</li><li>Count the full stops between the two readings. T2.8 → T4 → T5.6 is <b>2</b>. That’s your extra light.</li><li>Still short? A bigger light (a 2K instead of a 1K) usually adds about 1 stop.</li></ol>`))}
    ${field('How long each take should play back (seconds)',inp('cam.playSec',{type:'number',ph:'10',r:true}),'Every take plays back for this long. Takes at a slower frame rate must record longer: at 6 frames per second, 10 seconds of playback means recording for 40.')}
  </div>

/* ---------- STEP 3 · N ---------- */
function stepN(){
  const p=P();
  const opts=[['','Choose your normal T-stop…']];
  for(let s=Math.ceil(p.sWide*3-EPS)/3;s<=p.sDeep+EPS;s+=1/3){ const r=Math.round(s*3)/3; const i=Math.round(r*3); opts.push([String(r),'T'+(THIRDS[i]??fmtT(r).slice(1))+(Math.abs(r-Math.round(r))>EPS?`  (${fmtT(r)} stop)`:'')]); }
  let warnHalf='';
  return head(3,'Choose <em>N,</em> your normal stop.','N is the T-stop you really plan to shoot your film at. Every take in the test is named by how far it is from N: N+1 is one stop brighter, N−2 is two stops darker.')+
  now('Picking the one T-stop that counts as “normal” for your film.','The whole test is measured from this point. Test at the stop you’ll really use: a test at T8 tells you little about a film you’ll shoot at T2.','you’ve picked N and can explain why you chose it.')+
  `<div class="card key"><div class="grid2">
    ${field('N: your normal shooting stop',sel('N',opts))}
    <div class="stat"><span class="label">Your N</span><span class="big-num">${p.sN==null?'—':fmtT(p.sN)}</span></div>
  </div></div>${warnHalf}
  ${why('How to choose N',`<ul style="margin:0;padding-left:20px"><li><b>Depth of field.</b> How much of the picture do you want sharp, from front to back? A smaller number means less in focus.</li><li><b>Your filters.</b> Diffusion or other filters in front of the lens cost light, so plan for them.</li><li><b>Your locations.</b> How much light can you actually get into those rooms?</li><li><b>Your lens.</b> Most lenses are sharpest a stop or two in from wide open.</li></ul>`)}
  ${orig(`<p class="big">N = T2.8</p><p style="margin:0">Chosen for shallow depth of field on the wider lenses used for Steadicam shots, and because the filters would “cut almost a stop of light” in a location with limited power. The meter and camera both stayed at Exposure Index 800, and the grey card was lit to T2.8.</p>`)}
  ${words(['N','tstop','dof','stop'])}`;
}

/* ---------- STEP 4 · LADDER ---------- */
function stepLadder(){
  const L=ladder(); if(!L) return head(4,'Build the <em>exposure ladder.</em>','')+needN();
  const {rows,base,p}=L;
  const light=log2(180/base.A0)+base.D0+0.5*base.G0;
  const allOK=rows.every(r=>r.match&&!r.problems.length);
  const fpsRows=rows.filter(r=>Math.abs(r.F-p.F0)>EPS).length, irisAny=rows.filter(r=>r.irisMoved).length;
  const candA=baseCandidates(p);
  const shutHead=p.speed?'Shutter speed (1/x of a second)':'Shutter angle';
  const irisOpts=[]; for(let s=p.sN-6;s<=p.sN+6+EPS;s+=0.5){ if(s>=p.sWide-EPS&&s<=p.sDeep+EPS) irisOpts.push([String(s),irisLabel(s,p.sN)]); }
  return head(4,'Build the <em>exposure ladder.</em>','The light never moves. To make each take brighter or darker, you change the <b>camera</b> (shutter angle, frame rate) and add or pull <b>scrims</b>. The lens stays at N, and there are no ND filters. The lab plans all 15 takes; your job is to check them.')+
  now('Planning the exact settings for all 15 takes, from N+5 (5 stops brighter) down to N−5 (5 stops darker).','If even one take lands on the wrong exposure, your results will point to the wrong limits. Checking the math now is much cheaper than reshooting.','every row shows a green ✓ and your group understands how each row gets its exposure (the small grey line under each ✓).')+
  `<div class="card soft"><span class="label">All the math you need</span>
    <div class="grid2">
      <div><b>Double the shutter angle</b> (90° → 180°) = <b>1 stop brighter</b><br><b>Halve the shutter angle</b> (180° → 90°) = <b>1 stop darker</b></div>
      <div><b>Halve the frame rate</b> (24 → 12, same shutter angle) = <b>1 stop brighter</b><br><b>Pull out a double scrim</b> = <b>1 stop brighter</b> · <b>add one</b> = <b>1 stop darker</b><br><b>Single scrim</b> = <b>½ stop</b> (used for the half-stop takes)</div>
    </div>
    <p class="hint" style="margin:10px 0 0">Why: exposure time = shutter angle ÷ 360 ÷ frames per second. Twice the time is twice the light, which is 1 stop. And each full mark on the lens ring is 1 stop.</p></div>
  <h2>Your starting settings (at N)</h2>
  <div class="card key">
    <div class="grid3">
      <div class="stat"><span class="label">Lens T-stop</span><span class="big-num">${fmtT(p.sN)}</span></div>
      <div class="stat"><span class="label">${p.speed?'Shutter speed':'Shutter angle'} at N</span><span class="big-num">${p.speed?fmtDen(360*p.F0/base.A0):fmtAng(base.A0)}</span></div>
      <div class="stat"><span class="label">Scrims in the light at N</span><span class="big-num" style="font-size:30px">${base.D0} double${base.D0===1?'':'s'}${base.G0?` + ${base.G0} single`:''}</span></div>
    </div>
    <p style="margin:14px 0 6px"><b>Why start here instead of the usual 180° with no scrims?</b> You need room to make takes <em>brighter</em> than N. From a normal 180°, the only ways up are dropping the frame rate a lot or opening the lens, and opening the lens changes depth of field, a second variable. Starting N at a ${p.speed?'faster shutter':'smaller shutter angle'}${base.D0||base.G0?` with ${[base.D0?base.D0+' double scrim'+(base.D0>1?'s':''):'',base.G0?base.G0+' single scrim':''].filter(Boolean).join(' and ')} already in the light`:''} leaves room to <b>open the shutter${base.D0?' and pull scrims out':''}</b> for the brighter takes, and to <b>close the shutter${p.Dmax>base.D0?' and add scrims':''}</b> for the darker ones.</p>
    ${light>p.headroom+EPS?`<div class="bad">These starting settings need more light than the ${fmtStops(p.headroom,false)} stops of extra light you listed on the Camera step.</div>`:''}
    ${light>0.01?`<div class="warn" style="margin-bottom:0"><b>Light needed:</b> this setup needs <b>${fmtStops(light,false)} stop${light>1.01?'s':''} more light</b> than a normal 180° setup with no scrims. That’s <b>${Math.round(Math.pow(2,light)*10)/10}× as much light</b>. Pick a tungsten light that can get there, and set how far away it is and how focused its beam is <em>before</em> you lock it. If it can’t reach N, lower “Extra light available” on the Camera step.</div>`:''}
    <div class="row noprint" style="margin-top:14px">
      <label class="check" style="border:0;padding:0"><input type="checkbox" data-bind="base.auto" data-r="1" ${S.base.auto?'checked':''}><span>Use the lab’s recommended starting settings</span></label>
      ${S.base.auto?'':`${sel('base.A0',candA.map(a=>[String(a),(p.speed?fmtDen(360*p.F0/a):fmtAng(a))+' at N']),{num:true,cls:'sm'})}${sel('base.D0',Array.from({length:p.Dmax+1},(_,i)=>[String(i),i+' double scrim'+(i===1?'':'s')+' in at N']),{num:true,cls:'sm'})}${p.Gmax?sel('base.G0',Array.from({length:Math.min(1,p.Gmax)+1},(_,i)=>[String(i),i+' single scrim'+(i===1?'':'s')+' in at N']),{num:true,cls:'sm'}):''}`}
    </div>
    <p class="hint" style="margin:6px 0 0">${S.base.auto?'The lab tried every starting shutter angle and scrim combination your camera allows and picked the one that keeps the lens at N and needs the fewest frame-rate changes, without needing more light than you have. Uncheck the box to choose your own starting settings, for example to match what your DP wants at N.':'You’re choosing the starting settings yourself. The table below re-plans every take from them. Tick the box again to go back to the lab’s recommendation.'}</p>
    <p class="hint" style="margin:8px 0 0">${fpsRows?`${fpsRows} take${fpsRows>1?'s':''} change the frame rate. Motion will look different in those, and that’s fine: you’re judging brightness and texture, not movement. `:'No takes change the frame rate. '}${irisAny?`<b>⚠︎ ${irisAny} take${irisAny>1?'s':''} had to move the lens</b>, because nothing else could reach ${irisAny>1?'them':'it'}. That changes depth of field. Try adding scrims or widening the frame-rate range on the Camera step, or ask your instructor.`:'The lens stays at N for every take.'}</p>
  </div>
  <h2>Your 15 takes</h2>
  <p>Each row shows what to set for one take. The <b>math check</b> column adds it all up. If your camera can’t do a setting, type what it <em>can</em> do: the check updates, and turns red if that take no longer lands where it should. <span class="pill ${allOK?'ok':'bad'}">${allOK?'All 15 takes check out':'Some takes need fixing'}</span></p>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Take</th><th>Lens T-stop</th><th>${shutHead}</th><th>Frame rate (per second)</th><th>Double scrims in</th><th>Single scrims in</th><th>Record for</th><th>Math check</th><th>Prove it with the meter</th></tr></thead>
    <tbody>${rows.map(r=>{
      const k=rk(r.o), isN=Math.abs(r.o)<EPS;
      const irisTag=r.irisMoved?'<div><span class="pill warn">⚠︎ lens moved: avoid if you can</span></div>':'';
      const verdict=irisTag+(r.problems.length?`<span class="pill bad">✗ ${esc(r.problems[0])}</span>`:(r.match?`<span class="pill ok">✓ ${fmtO(r.actual)}</span>`:`<span class="pill bad">✗ this is really ${fmtO(r.actual)}</span>`));
      const shutCell=p.speed?`<input class="sm" type="number" step="any" data-edit="${k}.den" value="${esc(Math.round(r.den*10)/10)}" aria-label="Shutter speed 1/x for ${fmtO(r.o)}">`:`<input class="sm" type="number" step="any" data-edit="${k}.angle" value="${esc(Math.round(r.angle*100)/100)}" aria-label="Shutter angle for ${fmtO(r.o)}">`;
      return `<tr class="${isN?'isN':''} ${r.o%1?'half':''}">
        <td class="rung">${fmtO(r.o)}<div class="how">${esc(plainO(r.o))}</div></td>
        <td style="min-width:150px"><select class="sm" data-edit="${k}.s" aria-label="Lens T-stop for ${fmtO(r.o)}">${irisOpts.map(([v,l])=>`<option value="${v}" ${Math.abs(Number(v)-r.s)<EPS?'selected':''}>${esc(l)}</option>`).join('')}</select></td>
        <td style="min-width:92px">${shutCell}${p.speed&&Math.abs(log2(nearDen(r.den)/r.den))>0.01?`<div class="how">not on your menu? use ${fmtDen(nearDen(r.den))}</div>`:''}</td>
        <td style="min-width:80px"><input class="sm" type="number" step="any" data-edit="${k}.F" value="${esc(fmtFps(r.F))}" aria-label="Frame rate for ${fmtO(r.o)}"></td>
        <td style="min-width:70px"><input class="sm" type="number" step="1" data-edit="${k}.D" value="${r.D}" aria-label="Double scrims for ${fmtO(r.o)}"></td>
        <td style="min-width:70px"><input class="sm" type="number" step="1" data-edit="${k}.G" value="${r.G}" aria-label="Single scrims for ${fmtO(r.o)}"></td>
        <td class="mono">${r.rec} sec</td>
        <td>${verdict}<div class="how">${esc(r.how)}</div></td>
        <td class="meter">${r.scrimChange?`After changing scrims, a dome reading at the actor should say <b>${fmtT(r.incident)}</b>.<br>`:''}Meter set to ${fmtFps(r.F)} frames/sec and ${p.speed?fmtDen(r.den):fmtAng(r.angle)} → says <b>${fmtT(r.meterRec)}</b>. Lens is at ${esc(irisLabel(r.s,p.sN))}.</td>
      </tr>`;}).join('')}</tbody></table></div>
  <div class="row noprint"><button class="btn small" data-act="resetLadder">Undo my changes: go back to the lab’s plan</button>${Object.keys(S.edits).length?'<span class="hint">You’ve changed some settings by hand.</span>':''}</div>
  <p class="hint">A meter number below T1 (like “T0.7”) is just the math going past the end of the meter’s scale. The meter will show it as “under”, meaning very dark. That’s expected for the darkest takes.</p>
  ${why('How to read “Prove it with the meter”',`<p>This is how you <b>prove</b> each take is right with the Speedmaster. Type that row’s frame rate and shutter angle into the meter (same Exposure Index) and take a dome reading at the actor. The meter tells you which T-stop would be a <em>normal</em> exposure at those settings. Compare that to where the lens actually is:</p><p><b>The meter says T5.6 but the lens is at T2.8, so the lens is 2 stops more open than normal. That’s N+2.</b></p><p style="margin:0">For takes where scrims go in or out, first check that the dome reading changed by the amount you expected. Real scrims aren’t perfect: a “double” can really be ¾ or 1¼ stops. If it’s off, type the real reading on the Shoot step and the lab corrects that take.</p>`)}
  ${why('Why half-stops only near N',`<p style="margin:0">The most interesting changes happen within a stop and a half of N: where skin looks best, and where it starts to go wrong. Past ±2 stops you’re only finding the walls, so whole stops are enough.</p>`)}
  <details><summary>See the original F3 ladder</summary>
  ${orig(`<p class="hint">N = T2.8 · 45° shutter · 24 frames per second · 1 double scrim in. The lens only moved halfway for the half-stops. The shutter did the middle takes, the frame rate the brightest, and double scrims the darkest.</p>
   <div class="tbl-wrap"><table><thead><tr><th>Take</th><th>T-stop</th><th>Shutter angle</th><th>Frame rate</th><th>Scrims</th><th>Record for</th></tr></thead><tbody>
   ${[['+5','2.8','180°','6','none','40 sec'],['+4','2.8','180°','6','1 double','40 sec'],['+3','2.8','180°','12','1 double','20 sec'],['+2','2.8','180°','24','1 double','10 sec'],['+1½','halfway 2 and 2.8','90°','24','1 double','10 sec'],['+1','2.8','90°','24','1 double','10 sec'],['+½','halfway 2 and 2.8','45°','24','1 double','10 sec'],['N','2.8','45°','23.976','1 double','10 sec'],['−½','halfway 2.8 and 4','45°','24','1 double','10 sec'],['−1','2.8','22.5°','24','1 double','10 sec'],['−1½','halfway 2.8 and 4','22.5°','24','1 double','10 sec'],['−2','2.8','11.25°','24','1 double','10 sec'],['−3','2.8','11.25°','24','2 doubles','10 sec'],['−4','2.8','11.25°','24','3 doubles','10 sec'],['−5','2.8','11.25°','24','4 doubles','10 sec']].map(r=>`<tr><td class="rung">${r[0]}</td>${r.slice(1).map(c=>`<td class="mono">${c}</td>`).join('')}</tr>`).join('')}
   </tbody></table></div>`)}</details>
  ${words(['ladder','rung','N','stop','shutter','fps','scrim','tstop','split','dof','incident','meter'])}`;
}

/* ---------- STEP 5 · METER ---------- */
function stepMeter(){
  const L=ladder(); if(!L) return head(5,'Light to N. <em>Then lock everything.</em>','')+needN();
  const {base,p}=L, c=S.cam;
  const baseShut=p.speed?fmtDen(360*p.F0/base.A0):fmtAng(base.A0);
  const eqDen=Math.round(360*p.F0/base.A0);
  const scrimTxt=[base.D0?`${base.D0} double scrim${base.D0>1?'s':''}`:'',base.G0?`${base.G0} single scrim`:''].filter(Boolean).join(' + ')||'no scrims';
  const rd=k=>parseReading(S.setup[k]);
  const key=rd('key'),fill=rd('fill');
  let ratio='';
  if(key!=null&&fill!=null){ const d=key-fill; ratio=`The key side is <b>${fmtStops(Math.abs(d),false)} stop${Math.abs(Math.abs(d)-1)<0.05?'':'s'}</b> ${d>=0?'brighter':'darker'} than the fill side. That’s a lighting ratio of about <b>${(Math.round(Math.pow(2,Math.abs(d))*10)/10)}:1</b>.`; }
  return head(5,'Light to N. <em>Then lock everything.</em>','You set the light <b>once</b>, using the meter, and after that you never touch it except to add or pull scrims. Here’s exactly how to meter for <em>your</em> plan.')+
  now('Using the light meter to set the light so a normal exposure lands exactly on N, then locking the light and the camera.','This is your starting line. If N is off, every take is off by the same amount and all your conclusions shift.','the dome reading at the actor says exactly '+fmtT(p.sN)+', everything is taped, the grey card looks right on the waveform, and the readings below are filled in.')+
  `<div class="card key"><span class="label">Set these on the Speedmaster before lighting to N</span>
   <div class="grid3">
     <div class="stat"><span class="label">Exposure Index (ISO)</span><span class="big-num">${esc(c.ei||'—')}</span></div>
     <div class="stat"><span class="label">Frame rate</span><span class="big-num">${fmtFps(p.F0)}</span></div>
     <div class="stat"><span class="label">${p.speed?'Shutter speed':'Shutter angle'}</span><span class="big-num">${baseShut}</span></div>
   </div>
   <p style="margin:12px 0 0">The dome reading at the actor should say: <span class="big-num" style="font-size:32px">${fmtT(p.sN)}</span> &nbsp;with <b>${scrimTxt}</b> in the key light.</p></div>
  <h2>Setup procedure</h2>
  <ol class="steps-list">
    <li><div><b>Write N at the top of every log sheet:</b> ${fmtT(p.sN)}.</div></li>
    <li><div><b>Set the meter.</b> On the Speedmaster, choose the <b>cine mode where you type in frame rate and shutter angle</b> (called HD Cine). Set the ISO to <b>${esc(c.ei||'—')}</b>, the frame rate to <b>${fmtFps(p.F0)}</b>, the shutter angle to <b>${p.speed?`${fmtAng(base.A0)} (the same as ${fmtDen(eqDen)} of a second)`:fmtAng(base.A0)}</b>, and the filter setting to 0. <span class="hint">If your meter only takes shutter speeds, use ${fmtDen(eqDen)}.</span>${Math.abs(base.A0-180)>1?` <span class="hint">Yes, ${fmtAng(base.A0)}, not 180°. The meter has to match what the camera really does at N, or your N will be off by ${fmtStops(Math.abs(log2(180/base.A0)),false)} stop${Math.abs(log2(180/base.A0))>1.01?'s':''}.</span>`:''}</div></li>
    <li><div><b>Put ${scrimTxt} in the key light</b> before you meter.${base.D0||base.G0?' They’re part of N: pulling them out later is how you make the brighter takes.':''}</div></li>
    <li><div><b>Take a dome (incident) reading at the stand-in’s nose</b>, with the white dome pointed at the camera lens. It measures the light arriving at the face, not the light bouncing off it.</div></li>
    <li><div><b>Move the lamp until the meter says exactly ${fmtT(p.sN)}.</b> Focus or spread its beam, or move it closer or farther. <b>Don’t</b> use a dimmer (tungsten turns orange) and <b>don’t</b> touch the lens. Leave yourself room: if the light is already at full power and fully focused just to reach N, you have nothing left.</div></li>
    <li><div><b>Frame the shot</b> so the stand-in, grey card, color chart and costume fabrics are all clearly visible in the same frame.</div></li>
    <li><div><b>Lock everything.</b> Tape the stand, the beam knob and the lamp head. Measure the distance from the light to the actor and write it down.</div></li>
    <li><div><b>Set the camera to match:</b> lens ${fmtT(p.sN)} · shutter ${baseShut} · ${fmtFps(p.F0)} frames per second · Exposure Index ${esc(c.ei||'—')} · white balance ${esc(c.wb||3200)}K · ND filter out · every automatic setting off. Write each setting on the slate.</div></li>
    <li><div><b>Check it on the waveform.</b> The grey card should sit around <b>40–45 IRE</b>. Log profiles put it a little lower, about 38–42. <b>The meter sets N and the waveform just confirms it.</b> If the card is way off, re-check the meter’s frame rate, shutter and ISO before you touch the light.</div></li>
    <li><div><b>Slate every take</b> with how far it is from N (N+3, N−1½…), written big enough to read in a small thumbnail. A take you can’t identify later is a take you didn’t shoot.</div></li>
  </ol>
  <h2>Record the readings around the frame</h2>
  <p>Take dome readings at each spot with the meter still on the settings above. Type them the way the Speedmaster shows them, for example <span class="mono">2.8</span>, <span class="mono">4 1/3</span>, or <span class="mono">2.8 7</span> (the meter’s small number means tenths, so that’s 2.8 plus 7/10 of a stop).</p>
  <div class="grid2">
    ${[['key','Key side of the face'],['fill','Fill side of the face'],['bg','Background'],['hair','Hair / separation light']].map(([k,l])=>field(l,inp('setup.'+k,{ph:'e.g. 2.8',r:true}),(()=>{const v=rd(k);return v==null?'':`= <b>${fmtO(v-p.sN)}</b>: ${esc(plainO(v-p.sN))} than N`;})())).join('')}
    ${field('Distance from light to actor',inp('setup.dist',{ph:'e.g. 9 feet 4 inches'}))}
    ${field('Light used',inp('setup.fixture',{ph:'e.g. Arri 2K Fresnel, beam 3/4 focused'}))}
  </div>
  ${ratio?`<div class="good">${ratio}</div>`:''}
  ${why('Why lock everything',`<p style="margin:0">Once N is set, the only things allowed to change are exposure settings: shutter, frame rate, scrims, and the lens for the half-steps. If the light moves (a bumped stand, a lamp still warming up, a nudged dimmer), every take after that is measuring the wrong thing.</p>`)}
  ${words(['meter','incident','ei','fps','shutter','scrim','dimmer','grey','waveform','ire','nd','kelvin','ratio','keyfill','slate','standin'])}`;
}

/* ---------- STEP 6 · MAP ---------- */
const MK_LABELS=['Grey card','Skin: key side','Skin: fill side','Main costume fabric','Second fabric','Background','Hair / edge','Brightest highlight','Darkest shadow you care about','Practical (lamp in shot)','Other'];
function zone(v){
  const clip=parseFloat(S.map.clip), floor=parseFloat(S.map.floor);
  const hasC=!isNaN(clip), hasF=!isNaN(floor);
  if(hasC&&v>clip+EPS) return 'hot';
  if(hasF&&v<-floor-EPS) return 'cold';
  if(hasC||hasF) return 'good';
  return 'n';
}
function stepMap(){
  const p=P(); if(p.sN==null) return head(6,'Map your <em>frame.</em>','')+needN();
  const M=S.map, rung=Number(M.rung)||0;
  const ms=M.markers.map((m,i)=>({...m,i,s:parseReading(m.reading)}));
  const valid=ms.filter(m=>m.s!=null);
  return head(6,'Map your <em>frame.</em>','Before you record, measure how bright each important thing in the shot is: skin, fabric, background, the brightest spot, the darkest shadow. Pin each reading on a photo of your frame and you’ll see where everything lands in every take.')+
  now('Taking spot-meter readings of the important parts of your frame and pinning them on a photo.','When you review, you’ll know <em>why</em> something broke. For example: “the lamp was already 3 stops over N, so at N+2 it clipped.”','you have readings for at least the grey card, the skin (key and fill sides), a fabric, the brightest spot and the darkest shadow you care about.')+
  `${why('What a spot reading tells you',`<p>With the 1° spot viewfinder (same meter settings as N), aim at one surface and press measure. The number is the T-stop that would make <em>that surface</em> look like middle grey. If N is ${fmtT(p.sN)} and the skin reads ${fmtT(p.sN+1)}, the skin is <b>1 stop brighter than grey: N+1</b>.</p><p style="margin:0">Then the ladder moves everything together. In the N+2 take, that same skin sits at <b>N+3</b>. Click the take buttons below to see it.</p>`)}
  <div class="row noprint">
    <button class="btn" data-act="pickImg">${M.img?'Replace photo':'Add a photo of your frame'}</button>
    ${M.img?`<button class="btn ${S.ui.adding?'primary':''}" data-act="toggleAdd">${S.ui.adding?'Now click the photo where you took the reading…':'+ Add a reading on the photo'}</button>`:''}
    <button class="btn ghost" data-act="addMarker">+ Add a reading without a photo</button>
    ${M.img?'<button class="btn small ghost" data-act="rmImg">Remove photo</button>':''}
  </div>
  <p class="hint">Use a still from the monitor or a phone photo taken next to the camera. It stays on this computer only.</p>
  <span class="label" style="margin-top:14px">Show the frame as it looks in take…</span>
  <div class="rungbar">${RUNGS.map(o=>`<button class="${Math.abs(o-rung)<EPS?'on':''}" data-act="mapRung" data-arg="${o}">${fmtO(o)}</button>`).join('')}</div>
  <p class="hint">Showing <b>${fmtO(rung)}</b>: ${esc(plainO(rung))}.</p>
  ${M.img?`<div class="map ${S.ui.adding?'adding':''}" id="mapBox"><img src="${M.img}" alt="Test frame with meter readings" id="mapImg">${ms.map(m=>{const v=m.s==null?null:m.s-p.sN+rung;const z=v==null?'n':zone(v);return `<div class="mk" style="left:${m.x}%;top:${m.y}%"><span class="dotn">${m.i+1}</span><span class="tag ${z}">${m.s==null?esc(m.label||'?'):`${esc(fmtT(m.s))} · ${fmtO(v)}`}</span></div>`;}).join('')}</div>`:''}
  <h3>Your readings</h3>
  ${ms.length?`<div class="tbl-wrap"><table><thead><tr><th>#</th><th>What you measured</th><th>Spot reading</th><th>In the N take</th><th>In the ${fmtO(rung)} take</th><th></th></tr></thead><tbody>
    ${ms.map(m=>`<tr><td class="mono">${m.i+1}</td><td style="min-width:170px">${sel(`map.markers.${m.i}.label`,MK_LABELS)}</td><td style="min-width:110px">${inp(`map.markers.${m.i}.reading`,{ph:'e.g. 4 1/3',cls:'sm',r:true})}</td><td class="mono">${m.s==null?'—':fmtO(m.s-p.sN)}</td><td class="mono"><b>${m.s==null?'—':fmtO(m.s-p.sN+rung)}</b></td><td><button class="btn small ghost" data-act="rmMarker" data-arg="${m.i}" aria-label="Delete reading">✕</button></td></tr>`).join('')}
  </tbody></table></div>`:'<p class="muted">No readings yet.</p>'}
  ${valid.length?`<h3>Where everything lands, take by take</h3>
  <p class="hint">Each box shows how many stops brighter (+) or darker (−) than middle grey that thing is in that take. After the test, fill in your clip point and noise floor below to color the chart.</p>
  <div class="tbl-wrap"><table class="heat"><thead><tr><th>What</th>${RUNGS.map(o=>`<th>${fmtO(o)}</th>`).join('')}</tr></thead><tbody>
  ${valid.map(m=>`<tr><td class="lbl">${m.i+1}. ${esc(m.label)}</td>${RUNGS.map(o=>{const v=m.s-p.sN+o;return `<td class="z-${zone(v)}">${fmtO(v).replace('N','')||'0'}</td>`;}).join('')}</tr>`).join('')}
  </tbody></table></div>`:''}
  <div class="card soft"><span class="label">After the test (optional)</span>
    <div class="grid2">
      ${field('Clip point: how many stops above grey?',inp('map.clip',{type:'number',ph:'e.g. 3',r:true}),'Find the first take where the <b>grey card itself</b> turns into a flat line at the top of the waveform. That take’s number (e.g. N+3 → 3) is your clip point. Leave it blank if it never clipped.')}
      ${field('Noise floor: how many stops below grey?',inp('map.floor',{type:'number',ph:'e.g. 4',r:true}),'The first take where the grey card dissolves into noise.')}
    </div>
    <p class="hint" style="margin:0"><span class="pill bad">red</span> too bright, detail lost · <span class="pill ok">green</span> still has detail · <span class="pill" style="background:var(--blue-soft);color:var(--blue)">blue</span> lost in noise</p>
  </div>
  ${words(['spot','grey','clip','noise','practical','N','stop'])}`;
}

/* ---------- STEP 7 · SHOOT ---------- */
function stepShoot(){
  const L=ladder(); if(!L) return head(7,'Take this page <em>to the floor.</em>','')+needN();
  const {rows,base,p}=L, pi='p'+curProf(), T=S.takes[pi]||{};
  const done=RUNGS.filter(o=>T[rk(o)]?.shot).length;
  const cl=[
    'Tungsten light locked in place. Stand, lamp head and beam knob taped.',
    `Starting scrims are in: <b>${[base.D0?base.D0+' double'+(base.D0>1?'s':''):'',base.G0?base.G0+' single':''].filter(Boolean).join(' + ')||'none'}</b>.`,
    'Distance from the light to the actor measured and written down.',
    `Dome reading at the actor’s nose, pointed at the lens, says <b>${fmtT(p.sN)}</b> (meter set to ISO ${esc(S.cam.ei)}, ${fmtFps(p.F0)} frames per second, ${fmtAng(base.A0)} shutter).`,
    'Dimmer not used, or taped so nobody touches it.',
    `White balance set by hand to ${esc(S.cam.wb||3200)}K (not auto).`,
    `Exposure Index set to ${esc(S.cam.ei)} (the camera’s native rating).`,
    'ND filter out. Auto iris, auto ISO and every other automatic setting off. The ladder uses only T-stop, shutter, frame rate and scrims.',
    'Grey card checked: about 40–45 IRE on the waveform.',
    'Slate is readable in a small thumbnail.'
  ];
