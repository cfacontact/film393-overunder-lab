<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Over/Under Test Planner</title>
<meta name="description" content="FILM 393 · Step-by-step designer for the over/under exposure test: build your ladder, meter it, log it, analyze it.">
<style>
:root{
  --bg:#ffffff; --paper:#ffffff; --ink:#1d1b18; --muted:#5f5b55; --line:#dcdcdc; --soft:#f5f5f3;
  --accent:#a8431d; --accent-soft:#f6e3d9; --ok:#2b7a4b; --ok-soft:#dff0e5; --bad:#b3261e; --bad-soft:#f8dedb;
  --warn:#8a5a00; --warn-soft:#f7ecd0; --blue:#2c5a96; --blue-soft:#dde7f4;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--sans)}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:16px;padding:10px 20px}
.top .brand{font:600 12px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase}
.top .brand b{color:var(--accent)}
.top .grp{margin-left:auto;font:13px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.top button{flex:none}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px;margin:0 auto}
nav.steps{position:sticky;top:50px;align-self:start;padding:20px 12px 40px 20px;max-height:calc(100vh - 50px);overflow:auto}
nav.steps ol{list-style:none;margin:0;padding:0}
nav.steps li button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%;padding:7px 8px;border-radius:6px;font-size:14.5px;line-height:1.3;color:var(--muted);box-sizing:border-box}
nav.steps li button:hover{background:var(--soft);color:var(--ink)}
nav.steps li button:focus-visible{outline:2px solid var(--accent)}
nav.steps li.on button{background:var(--ink);color:var(--paper)}
nav.steps .n{font:12px/1.5 var(--mono);min-width:20px}
nav.steps .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex:none;margin-top:5px}
nav.steps .dot.done{background:var(--ok);border-color:var(--ok)}
main{padding:28px 32px 80px;min-width:0}
.eyebrow{font:12px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:42px;line-height:1.05;margin-bottom:12px}
h1 em,h2 em{font-style:italic}
h2{font-size:30px;line-height:1.15;margin:34px 0 10px}
h3{font-size:21px;margin:24px 0 8px}
p{margin:0 0 14px;max-width:70ch}
.lead{font-size:19px;max-width:62ch}
.rule{border:0;border-top:1px solid var(--line);margin:26px 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin:16px 0}
.card.soft{background:var(--soft)}
.card.key{border:2px solid var(--ink)}
.label{font:11.5px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:block}
.why{background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:0 8px 8px 0;padding:14px 18px;margin:16px 0}
.why .label{color:var(--blue)}
.orig{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:16px 0}
.orig .label{color:var(--accent)}
.orig .big{font:21px/1.3 var(--serif);margin:0 0 8px}
.warn{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0}
.bad{background:var(--bad-soft);border-left:4px solid var(--bad);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0}
.good{background:var(--ok-soft);border-left:4px solid var(--ok);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0}
details{margin:12px 0}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
details[open] summary{margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-weight:600;font-size:15px}
.field small,.hint{color:var(--muted);font-size:13.5px;line-height:1.4}
input[type=text],input[type=number],select,textarea{font:16px var(--sans);color:var(--ink);background:#fff;border:2px solid #9aa3ad;border-radius:7px;padding:9px 11px;width:100%;min-width:0}
input[type=text]:placeholder-shown,input[type=number]:placeholder-shown,textarea:placeholder-shown,select.empty{background:#fff8d6;border-color:#d9a400}
input.calc,input.calc:placeholder-shown{background:#eef5ff;border-color:#8fb0d9}
input.calc::placeholder{color:var(--ink);opacity:1}
.calc-key{display:inline-block;width:18px;height:14px;background:#eef5ff;border:2px solid #8fb0d9;border-radius:4px;vertical-align:-2px;margin-right:4px}
.field>span::after{content:''}
.scrim-sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid;vertical-align:-2px;margin-right:4px;background:repeating-linear-gradient(45deg,#999 0 1px,transparent 1px 3px)}
.scrim-sw.red{border-color:#d0312d}.scrim-sw.green{border-color:#2e9e4f}
.fill-key{display:inline-block;width:18px;height:14px;background:#fff8d6;border:2px solid #d9a400;border-radius:4px;vertical-align:-2px;margin-right:4px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);background:#fff}
textarea{min-height:84px;resize:vertical}
input.sm,select.sm{padding:6px 7px;font-size:14.5px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok);flex:none}
.btn{font:600 15px var(--sans);border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;padding:9px 16px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:var(--line)}
.btn.small{padding:5px 10px;font-size:13.5px}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.tbl-wrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.rung{font:600 15px var(--mono);white-space:nowrap}
tr.isN td{background:var(--accent-soft)}
tr.half td.rung{color:var(--muted)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.how{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:3px}
.pill{display:inline-block;font:600 12.5px/1 var(--mono);padding:5px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--soft);color:var(--muted)}
.meter{font-size:12.5px;line-height:1.35}
.big-num{font:500 44px/1 var(--serif)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .label{margin:0}
.steps-list{counter-reset:s;list-style:none;padding:0;margin:10px 0}
.steps-list>li{counter-increment:s;display:grid;grid-template-columns:38px 1fr;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.steps-list>li::before{content:counter(s,decimal-leading-zero);font:14px/1.6 var(--mono);color:var(--muted)}
.quiz-item{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.quiz-fb{grid-column:1/-1;font-size:14px;padding:8px 12px;border-radius:6px}
.quiz-fb.right{background:var(--ok-soft)}
.quiz-fb.wrong{background:var(--bad-soft)}
.roles{display:grid;gap:10px}
.role-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 40px;gap:8px;align-items:center}
.ruler{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px;margin:10px 0}
.ruler button{all:unset;cursor:pointer;height:52px;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper);box-sizing:border-box}
.ruler button.on{background:repeating-linear-gradient(45deg,var(--ink) 0 2px,transparent 2px 7px)}
.ruler button.isN{border-width:3px}
.ruler button:focus-visible{outline:3px solid var(--accent)}
.ruler-l{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px;text-align:center;font:12px var(--mono)}
.map{position:relative;border-radius:10px;overflow:hidden;background:#000;user-select:none;margin:12px 0}
.map img{display:block;width:100%;height:auto}
.map.adding{cursor:crosshair;outline:3px solid var(--accent)}
.mk{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:0;pointer-events:none}
.mk .dotn{width:22px;height:22px;border-radius:50%;background:#fff;color:#000;font:700 12px/22px var(--mono);text-align:center;border:2px solid #000;flex:none}
.mk .tag{margin-left:5px;background:rgba(0,0,0,.78);color:#fff;font:600 12.5px/1.2 var(--mono);padding:4px 7px;border-radius:5px;white-space:nowrap;border:2px solid transparent}
.mk .tag.hot{border-color:#ff6b57}
.mk .tag.cold{border-color:#6aa6ff}
.mk .tag.good{border-color:#5fd18c}
.heat td{text-align:center;font:12.5px var(--mono);white-space:nowrap;padding:6px 5px}
.heat td.lbl{text-align:left;font:600 13px var(--sans)}
.z-hot{background:var(--bad-soft);color:var(--bad)}
.z-cold{background:var(--blue-soft);color:var(--blue)}
.z-good{background:var(--ok-soft);color:var(--ok)}
.z-n{background:transparent}
.rungbar{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.rungbar button{all:unset;cursor:pointer;font:600 12.5px var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.rungbar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.tabs button{all:unset;cursor:pointer;padding:7px 12px;border:1.5px solid var(--line);border-radius:99px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.slate{font:600 13px var(--mono);white-space:nowrap}
.lint{font-size:13px;margin-top:4px}
.save-note{font:12px var(--mono);color:var(--muted)}
.hide{display:none!important}
.talk{background:#f3eefc;border-left:4px solid #7a4fc9;border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0}
.talk .label{color:#6a3fb8}
.sync-pill{font:600 12px var(--mono);padding:5px 9px;border-radius:99px;white-space:nowrap}
.sync-pill.off{display:none}
.sync-pill.live{background:var(--ok-soft);color:var(--ok)}
.sync-pill.connecting{background:var(--soft);color:var(--muted)}
.sync-pill.offline{background:var(--warn-soft);color:var(--warn)}
.now{background:var(--paper);border:2px solid var(--accent);border-radius:10px;padding:16px 20px;margin:18px 0 22px}
.now .label{color:var(--accent)}
.now .doing{font:500 20px/1.35 var(--serif);margin-bottom:10px}
details.words{background:var(--soft);border-radius:10px;padding:10px 16px;margin:28px 0 0}
details.words summary{color:var(--ink)}
details.words dl{margin:6px 0 0}
details.words dt{font-weight:700;margin-top:10px}
details.words dd{margin:2px 0 0;color:var(--muted);font-size:15px}
details.howto{margin:6px 0 0;font-size:14.5px;color:var(--ink)}
details.howto summary{font-size:14px}
details.howto>div{background:var(--soft);border-radius:8px;padding:10px 14px}
details.howto ol{margin:0;padding-left:20px}
details.howto li{margin:4px 0}
dialog#gloss{max-width:720px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:0}
dialog#gloss::backdrop{background:rgba(0,0,0,.45)}
dialog#gloss .gh{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
dialog#gloss dl{padding:6px 20px 20px;margin:0}
dialog#gloss dt{font-weight:700;margin-top:14px}
dialog#gloss dd{margin:3px 0 0;color:var(--muted)}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  nav.steps{position:static;max-height:none;padding:10px 16px 0;overflow-x:auto}
  nav.steps ol{display:flex;gap:6px;width:max-content}
  nav.steps li button{padding:7px 10px;border:1px solid var(--line);white-space:nowrap;width:auto}
  nav.steps .t{display:none}
  nav.steps .dot{margin:5px 0 0 0}
  main{padding:20px 16px 60px}
  .grid2,.grid3{grid-template-columns:1fr}
  h1{font-size:34px}
  h2{font-size:25px}
  .quiz-item{grid-template-columns:1fr}
  .top .grp{display:none}
}
@media print{
  .top,nav.steps,.pager,.noprint,button.btn{display:none!important}
  .wrap{display:block}
  main{padding:0}
  body{background:#fff;color:#000;font-size:12px}
  .card,.orig,.why{break-inside:avoid;border-color:#999}
  .tbl-wrap{overflow:visible;border-color:#999}
  table{font-size:11px}
  h2{font-size:20px;margin-top:18px;break-after:avoid}
  .pagebreak{break-before:page}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">FILM 393 · <b>Over/Under</b> Test Planner</div>
  <div class="grp" id="grpLabel"></div>
  <span id="syncPill" class="sync-pill off noprint"></span>
  <button class="btn small noprint" data-act="gloss">Word list</button>
</header>
<div class="wrap">
  <nav class="steps" aria-label="Steps"><ol id="nav"></ol></nav>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="gloss" aria-label="Word list"><div class="gh"><h3 style="margin:0">Word list</h3><button class="btn small" data-act="closeGloss">Close</button></div><dl id="glossList"></dl></dialog>
<input type="file" id="fileImport" accept="application/json,.json" class="hide">
<input type="file" id="fileImg" accept="image/*" class="hide">
<script>
"use strict";
/* ============================================================
   STOP MATH
   Iris position is stored as "s" = stops from T1 (T1=0, T1.4=1, T2=2, T2.8=3 …).
   Bigger s = smaller opening = less light.
   Exposure time t = shutter angle / 360 / fps.
   Offset of a rung from N = log2(t/t0) + (doubles at N − doubles now) + (sN − s).
   ============================================================ */
const RUNGS=[5,4,3,2,1.5,1,0.5,0,-0.5,-1,-1.5,-2,-3,-4,-5];
const FULL=[1,1.4,2,2.8,4,5.6,8,11,16,22,32,45,64];
const THIRDS=[1,1.1,1.2,1.4,1.6,1.8,2,2.2,2.5,2.8,3.2,3.5,4,4.5,5,5.6,6.3,7.1,8,9,10,11,13,14,16,18,20,22,25,29,32];
const EIS=[100,125,160,200,250,320,400,500,640,800,1000,1280,1600,2000,2500,3200,4000,5000,6400,8000,10000,12800];
const EPS=1e-6;
const log2=Math.log2;

function tToS(T){
  T=Number(T); if(!(T>0)) return null;
  for(let i=0;i<FULL.length;i++) if(Math.abs(FULL[i]-T)/T<0.04) return i;
  for(let i=0;i<THIRDS.length;i++) if(Math.abs(THIRDS[i]-T)/T<0.025) return i/3;
  return 2*log2(T);
}
function fracGlyph(f){
  if(Math.abs(f)<0.08) return '';
  if(Math.abs(f-1/6)<0.05) return '⅙';
  if(Math.abs(f-5/6)<0.05) return '⅚';
  if(Math.abs(f-1/3)<0.09) return '⅓';
  if(Math.abs(f-0.5)<0.08) return '½';
  if(Math.abs(f-2/3)<0.09) return '⅔';
  return '.'+Math.round(f*10);
}
/* T-number label for an iris position, for example s=3 → "T2.8", s=3.333 → "T2.8 +⅓" */
function fmtT(s){
  if(s==null||isNaN(s)) return '—';
  const half=Math.abs(s*2-Math.round(s*2))<EPS && Math.abs(s-Math.round(s))>EPS;
  let base=Math.floor(s+EPS), frac=s-base;
  if(!half){ const r3=Math.round(s*3)/3; base=Math.floor(r3+EPS); frac=r3-base; if(frac>0.95){base++;frac=0;} }
  const name=base>=0&&base<FULL.length?FULL[base]:(Math.round(Math.pow(2,base/2)*10)/10);
  const g=fracGlyph(frac);
  return 'T'+name+(g?' +'+g:'');
}
/* Iris label relative to N — half stops shown as a split between two marks */
function irisLabel(s,sN){
  const d=s-sN;
  if(Math.abs(d)<EPS) return fmtT(s);
  if(Math.abs(Math.abs(d)-Math.round(Math.abs(d)))<EPS) return fmtT(s);
  const lo=sN+Math.trunc(d), hi=lo+Math.sign(d);
  const a=[fmtT(Math.min(lo,hi)),fmtT(Math.max(lo,hi))];
  return a[0]+' / '+a[1].replace('T','')+' split';
}
/* Stops as signed text: 1.5 → "+1½" */
function fmtStops(x,withSign=true){
  const sign=x>EPS?'+':(x<-EPS?'−':'');
  let a=Math.abs(x), w=Math.floor(a+EPS), f=a-w;
  let g=fracGlyph(f); if(Math.abs(f-1)<0.08){w++;g='';}
  let body=(w||!g?String(w):'')+g;
  if(body==='0') return '0';
  return (withSign?sign:'')+body;
}
/* Offset label: 0 → "N", 1.5 → "N+1½", -2 → "N−2" */
function fmtO(o){
  if(o==null||isNaN(o)) return '—';
  if(Math.abs(o)<0.08) return 'N';
  return 'N'+fmtStops(o);
}
function fmtAng(a){ return (Math.abs(a-Math.round(a))<0.01?Math.round(a):Math.round(a*100)/100)+'°'; }
function fmtFps(F){ return String(Math.round(F*1000)/1000); }
function fmtDen(den){ return '1/'+(den<10?Math.round(den*10)/10:Math.round(den)); }
const STD_DEN=[1,2,3,4,6,8,12,15,24,25,30,40,48,50,60,80,96,100,120,125,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500,3200,4000,5000,6400,8000,10000,12800,16000];
function nearDen(den){ let b=STD_DEN[0]; for(const d of STD_DEN) if(Math.abs(log2(d/den))<Math.abs(log2(b/den))) b=d; return b; }

/* Parse a meter reading: "2.8", "T4", "2.8 2/3", "2.8+1/3", "2.8 7" (Sekonic tenths), "5.6½" */
function parseReading(str){
  if(str==null) return null;
  let t=String(str).trim().toLowerCase().replace(/^[tf]\s*\/?\s*/,'')
    .replace('⅓',' 1/3').replace('⅔',' 2/3').replace('½',' 1/2').replace(/\s+/g,' ').trim();
  if(!t) return null;
  let m=t.match(/^(\d+(?:\.\d+)?)\s*(?:\+\s*)?(?:(\d)\s*\/\s*(\d))?$/);
  let base,frac=0;
  if(m){ base=parseFloat(m[1]); if(m[2]) frac=Number(m[2])/Number(m[3]); }
  else{
    m=t.match(/^(\d+(?:\.\d+)?)(?:\s*\+\s*|\s+)\.?(\d)$/);
    if(!m) return null;
    base=parseFloat(m[1]); frac=Number(m[2])/10;
  }
  const s=tToS(base); if(s==null) return null;
  return s+frac;
}
function snapEI(v){ let best=EIS[0]; for(const e of EIS) if(Math.abs(log2(e/v))<Math.abs(log2(best/v))) best=e; return best; }
const rk=o=>'r'+Math.round(o*2);

/* ============================================================
   STATE
   ============================================================ */
/* ?group=3 in the link gives each group its own label and its own saved work */
const GROUP=(new URLSearchParams(location.search).get('group')||'').replace(/[^\w-]/g,'').slice(0,20);
const KEY='film393-overunder-lab-v1'+(GROUP?'-g'+GROUP:'');
function fresh(){
  return {
    step:0,

  ${bad.length?`<div class="warn"><b>Heads up:</b> with these starting settings, ${bad.length} take${bad.length>1?'s':''} can’t be reached without moving the lens. Try a different starting angle or scrim count, or go back to the calculated settings.</div>`:'<div class="good"><b>✓ These starting settings reach every take without moving the lens.</b></div>'}
  ${talk('<b>Check the math together.</b> Before you light, make sure everyone can explain each line above out loud: why this many scrims, and why this starting angle.')}`;
  const baseShut=p.speed?fmtDen(360*p.F0/b.A0):fmtAng(b.A0);
  const eqDen=Math.round(360*p.F0/b.A0);
  const scrimTxt=[b.D0?`${b.D0} double scrim${b.D0>1?'s':''}`:'',b.G0?`${b.G0} single scrim`:''].filter(Boolean).join(' + ')||'no scrims';
  const rd=k=>parseReading(S.setup[k]);
  const key=rd('key'),fill=rd('fill');
  let ratio='';
  if(key!=null&&fill!=null){ const d=key-fill; ratio=`The key side is <b>${fmtStops(Math.abs(d),false)} stop${Math.abs(d)>1+EPS?'s':''}</b> ${d>=0?'brighter':'darker'} than the fill side. That’s a lighting ratio of about <b>${(Math.round(Math.pow(2,Math.abs(d))*10)/10)}:1</b>.`; }
  return head(4,'Starting settings. <em>Then light to N.</em>','Before you light anything, work out the settings for the N take. Then set the light <b>once</b>, using the meter, and never touch it again except to add or pull scrims.')+
  now('Setting the N take’s shutter angle and scrims (calculated for you: check the math), then setting the light with the meter.','If you start with too few scrims in the light, the brightest takes are impossible. Starting settings that don’t match the meter make every take wrong.','your group agrees on the starting settings, the grey card spot-meters exactly '+fmtT(p.sN)+', everything is locked, and the readings at the bottom are filled in.')+
  ws+`<h2>Part 2 · Light to N</h2>
  <div class="card key"><span class="label">Your N settings (from Part 1)</span>
   <div class="grid3">
     <div class="stat"><span class="label">Exposure Index (ISO)</span><span class="big-num">${esc(c.ei||'—')}</span></div>
     <div class="stat"><span class="label">Frame rate</span><span class="big-num">${fmtFps(p.F0)}</span></div>
     <div class="stat"><span class="label">${p.speed?'Shutter speed':'Shutter angle'}</span><span class="big-num">${baseShut}</span></div>
   </div>
   <p style="margin:12px 0 0">In the key light: <b>${scrimTxt}</b>. The spot reading of the grey card should say: <span class="big-num" style="font-size:32px">${fmtT(p.sN)}</span></p></div>
  <div class="card key"><span class="label">Dome or spot? What’s the difference</span>
   <div class="grid2">
     <div><p style="margin:0 0 6px"><b>Dome (incident) reading</b></p><p style="margin:0">Pop the white dome out and hold the meter <b>at the actor’s face</b>, dome pointed at the camera. It measures the light <b>arriving</b> at the actor. It doesn’t care what the actor is wearing or what color their skin is.</p></div>
     <div><p style="margin:0 0 6px"><b>Spot reading</b> <span class="pill ok">your professor’s preferred method</span></p><p style="margin:0">Stand <b>by the camera</b> and look through the meter’s small viewfinder. Put the circle on <b>one surface</b> (the grey card, a cheek, a shirt, a wall) and press measure. It measures the light <b>bouncing off that one thing</b>. The number is the T-stop that would make that surface middle grey.</p></div>
   </div>
   <p style="margin:12px 0 0"><b>How they connect:</b> a spot reading of the <b>18% grey card</b> gives the same number as a dome reading at the actor, because the grey card <em>is</em> middle grey. So in this test you <b>spot-meter the grey card</b> to set N, and you can check it with the dome. Spot readings of skin, fabric and background then tell you how many stops brighter or darker each one is than the grey card.</p>
  </div>
  <h3>Setup procedure</h3>
  <ol class="steps-list">
    <li><div><b>Write N at the top of every log sheet:</b> ${fmtT(p.sN)}.</div></li>
    <li><div><b>Set the meter.</b> On the Speedmaster, choose the <b>cine mode where you type in frame rate and shutter angle</b> (called HD Cine). Set the ISO to <b>${esc(c.ei||'—')}</b>, the frame rate to <b>${fmtFps(p.F0)}</b>, the shutter angle to <b>${p.speed?`${fmtAng(b.A0)} (the same as ${fmtDen(eqDen)} of a second)`:fmtAng(b.A0)}</b>, and the filter setting to 0. <span class="hint">If your meter only takes shutter speeds, use ${fmtDen(eqDen)}.</span>${Math.abs(b.A0-180)>1?` <span class="hint">Yes, ${fmtAng(b.A0)}, not 180°. The meter has to match what the camera really does at N, or your N will be off by ${fmtStops(Math.abs(log2(180/b.A0)),false)} stop${Math.abs(log2(180/b.A0))>1.01?'s':''}.</span>`:''}</div></li>
    <li><div><b>Put the starting scrims in the key light</b> (${scrimTxt}) before you meter. They’re part of N: pulling them out later is how you make the brighter takes.</div></li>
    <li><div><b>Put the grey card right next to the stand-in’s face</b>, facing the camera, in the key light.</div></li>
    <li><div><b>Spot-meter the grey card</b> from beside the camera: put the viewfinder circle fully inside the card and press measure.</div></li>
    <li><div><b>Move the lamp until the spot reading of the grey card says exactly ${fmtT(p.sN)}.</b> Focus or spread its beam, or move it closer or farther. <b>Don’t</b> use a dimmer (tungsten turns orange) and <b>don’t</b> touch the lens. Leave yourself room: if the light is already at full power and fully focused just to reach N, you have nothing left.</div></li>
    <li><div><b>Double-check with the dome.</b> A dome reading at the stand-in’s nose, pointed at the lens, should also say about ${fmtT(p.sN)}. If the two are more than ⅓ stop apart, check that the card is square to the camera and not catching glare, then trust the spot reading of the grey card.</div></li>
    <li><div><b>Frame the shot</b> so the stand-in, grey card and color chart are all clearly visible in the same frame (plus any costume fabrics you chose to include).</div></li>

  </ol>

  <div class="grid2">
    ${[['key','Skin on the key side of the face'],['fill','Skin on the fill side of the face'],['bg','Background'],['hair','Hair / separation light (on the hair)']].map(([k,l])=>field(l,inp('setup.'+k,{ph:'Example: 2.8',r:true}),(()=>{const v=rd(k);if(v==null) return '';const d=v-p.sN;return Math.abs(d)<0.08?'= <b>N</b>: exactly your normal exposure.':`= <b>${fmtO(d)}</b>: ${fmtStops(Math.abs(d),false)} stop${Math.abs(d)>1+EPS?'s':''} ${d>0?'brighter':'darker'} than N (${mult(d)}).`;})())).join('')}
    ${field('Distance from light to actor',inp('setup.dist',{ph:'Example: 9 feet 4 inches'}))}
    ${field('Light used',inp('setup.fixture',{ph:'Example: Arri 2K Fresnel, beam 3/4 focused'}))}
  </div>
  ${ratio?`<div class="good">${ratio}</div>`:''}
  ${why('Why lock everything',`<p style="margin:0">Once N is set, the only things allowed to change are the shutter angle, the frame rate and the scrims. If the light moves (a bumped stand, a lamp still warming up, a nudged dimmer), every take after that is measuring the wrong thing.</p>`)}
  ${words(['meter','spot','incident','ei','fps','shutter','scrim','single','dimmer','grey','waveform','ire','nd','kelvin','ratio','keyfill','slate','standin'])}`;
}

/* ---------- STEP 5 · LADDER (students fill it in) ---------- */
function stepLadder(){
  const L=ladder(); if(!L) return head(5,'Build the <em>exposure ladder.</em>','')+needN();
  const {rows,base:b,p}=L;
  if(!b.ready) return head(5,'Build the <em>exposure ladder.</em>','')+needStart();
  const filled=rows.filter(r=>!r.isN&&r.complete).length, good=rows.filter(r=>!r.isN&&r.complete&&r.match&&!r.problems.length).length;
  const shutHead=p.speed?'Shutter speed (type the bottom number of 1/x)':'Shutter angle (°)';
  const irisOpts=[]; for(let s=p.sN-6;s<=p.sN+6+EPS;s+=0.5){ if(s>=p.sWide-EPS&&s<=p.sDeep+EPS) irisOpts.push([String(s),irisLabel(s,p.sN)+(Math.abs(s-p.sN)<EPS?' (N, keep it here)':'')]); }
  const k1=log2(p.maxA/b.A0);
  /* calculated values show in blue; a typed value overrides just that cell */
  const cell=(k,f,calcVal,label)=>{const typed=numOrNull((S.rows[k]||{})[f]);return `<input class="sm ${typed==null?'calc':''}" type="number" step="any" data-bind="rows.${k}.${f}" data-num="1" data-r="1" value="${esc(typed??'')}" placeholder="${esc(calcVal)}" aria-label="${esc(label)}">`;};
  const hint=o=>{
    const dir=o>0?'brighter':'darker';
    let t=`You need to be <b>${fmtStops(Math.abs(o),false)} stop${Math.abs(o)>1?'s':''} ${dir}</b> than N. `;
    if(Math.abs(o%1)>EPS) t+='The half stop: use a single scrim (pull it out to go brighter, add one to go darker), or swap a double for a single. ';
    if(o>0) t+=`Opening the shutter from ${fmtAng(b.A0)} can give you up to ${fmtStops(k1,false)} stop${k1>1?'s':''}. After that, pull doubles out (+1 each). Frame rate is the last resort.`;
    else t+=`Closing the shutter (each halving is −1) and adding doubles (−1 each) are your tools. Frame rate is the last resort.`;
    return t;
  };
  return head(5,'Build the <em>exposure ladder.</em>','The light never moves: you change the <b>shutter angle</b>, the <b>scrims</b>, and (only if you must) the <b>frame rate</b>. The lens stays at N and there are no ND filters. Based on the math, every take is filled in from your starting settings. Check each one, and change any setting your camera can’t do.')+
  now('Checking the settings for all 14 takes around N. They’re calculated from your starting settings on step 4 and update the moment you change anything.','On set, you’ll need to plan exposure like this in your head. Following the math for each take now is how you learn it.','all 14 takes show a green ✓ and everyone in the group can explain how each one gets its exposure (the grey line under each ✓).')+
  `<div class="card soft"><span class="label">All the math you need</span>
    <div class="grid2">
      <div><b>Double the shutter angle</b> (90° → 180°) = <b>1 stop brighter</b><br><b>Halve the shutter angle</b> (180° → 90°) = <b>1 stop darker</b></div>
      <div><b>Pull out a double scrim</b> = <b>1 stop brighter</b> · <b>add one</b> = <b>1 stop darker</b><br><b>Single scrim</b> = <b>½ stop</b> · <b>Halve the frame rate</b> (24 → 12) = <b>1 stop brighter</b></div>
    </div>
    <p class="hint" style="margin:10px 0 0">Why: exposure time = shutter angle ÷ 360 ÷ frames per second. Twice the time is twice the light, which is 1 stop.</p></div>
  ${talk('<b>Split it up, then swap.</b> One person explains the brighter takes out loud, another the darker takes: which settings change, and how many stops each change adds up to. Everyone should be able to explain any row.')}
  <p>Your N take (from step 4): <b>${fmtT(p.sN)} · ${p.speed?fmtDen(360*p.F0/b.A0):fmtAng(b.A0)} · ${fmtFps(p.F0)} frames per second · ${[b.D0+' double'+(b.D0===1?'':'s'),p.Gmax?b.G0+' single'+(b.G0===1?'':'s'):''].filter(Boolean).join(' + ')} in the light</b>. <span class="calc-key"></span>Blue boxes are calculated. Type in any box to change it, and the math check re-checks that take. <span class="pill ${good===14?'ok':'neutral'}">${good} of 14 takes check out</span></p>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Take</th><th>Lens T-stop</th><th>${shutHead}</th><th>Frame rate (per second)</th><th>Doubles in the light</th>${p.Gmax?'<th>Singles in the light</th>':''}<th>Record for</th><th>Math check</th><th>Prove it with the meter</th></tr></thead>
    <tbody>${rows.map(r=>{
      const k=rk(r.o), e=S.rows[k]||{};
      if(r.isN) return `<tr class="isN"><td class="rung">N<div class="how">normal exposure</div></td><td class="mono">${fmtT(p.sN)}</td><td class="mono">${p.speed?fmtDen(360*p.F0/b.A0):fmtAng(b.A0)}</td><td class="mono">${fmtFps(p.F0)}</td><td class="mono">${b.D0}</td>${p.Gmax?`<td class="mono">${b.G0}</td>`:''}<td class="mono">${r.rec} sec</td><td><span class="pill ok">your starting settings</span></td><td class="meter">Grey card spot-meters ${fmtT(p.sN)}</td></tr>`;
      const verdict=!r.complete?'<span class="pill neutral">missing a setting</span>':(r.problems.length?`<span class="pill bad">✗ ${esc(r.problems[0])}</span>`:(r.match?`<span class="pill ok">✓ lands on ${fmtO(r.actual)}</span>`:`<span class="pill bad">✗ this lands on ${fmtO(r.actual)}, not ${fmtO(r.o)}</span>`));
      return `<tr class="${r.o%1?'half':''}">
        <td class="rung">${fmtO(r.o)}<div class="how">${esc(plainO(r.o))}</div><details class="howto"><summary>How to think about it</summary><div>${hint(r.o)}</div></details></td>
        <td style="min-width:200px"><select class="sm" data-bind="rows.${k}.s" data-r="1" aria-label="Lens T-stop for ${fmtO(r.o)}">${irisOpts.map(([v,l])=>`<option value="${v}" ${Math.abs(Number(v)-r.s)<EPS?'selected':''}>${esc(l)}</option>`).join('')}</select>${r.irisMoved?'<div><span class="pill warn">⚠︎ lens moved: avoid if you can</span></div>':''}</td>
        <td style="min-width:92px">${cell(k,p.speed?'den':'angle',r.angle?(p.speed?Math.round(360*r.F/r.angle*10)/10:Math.round(r.angle*100)/100):'','Shutter for '+fmtO(r.o))}</td>
        <td style="min-width:80px">${cell(k,'F',fmtFps(r.F),'Frame rate for '+fmtO(r.o))}</td>
        <td style="min-width:70px">${cell(k,'D',r.D??'','Doubles for '+fmtO(r.o))}</td>
        ${p.Gmax?`<td style="min-width:70px">${cell(k,'G',r.G??'','Singles for '+fmtO(r.o))}</td>`:''}
        <td class="mono">${r.rec} sec</td>
        <td>${verdict}${r.complete&&r.match&&!r.problems.length?`<div class="how">${esc(r.how)}</div>`:''}</td>
        <td class="meter">${r.complete?`${r.scrimChange?`After changing scrims, the grey card (meter on N settings) should spot-meter <b>${fmtT(r.incident)}</b>.<br>`:''}Meter set to ${fmtFps(r.F)} frames/sec and ${p.speed?fmtDen(r.den):fmtAng(r.angle)} → says <b>${fmtT(r.meterRec)}</b>. Lens is at ${esc(irisLabel(r.s,p.sN))}.`:'<span class="muted">—</span>'}</td>
      </tr>`;}).join('')}</tbody></table></div>
  <div class="row noprint"><button class="btn small ghost" data-act="clearLadder">Undo my changes: go back to the calculated ladder</button></div>
  <p class="hint">A meter number below T1 (like “T0.7”) is just the math going past the end of the meter’s scale. The meter will show it as “under”, meaning very dark. That’s expected for the darkest takes.</p>
  ${why('How to read “Prove it with the meter”',`<p>On the day, you can <b>prove</b> each take with the Speedmaster. Type that row’s frame rate and shutter angle into the meter (same Exposure Index) and spot-meter the grey card. The meter tells you which T-stop would be a <em>normal</em> exposure at those settings. Compare that to where the lens actually is:</p><p><b>The meter says T5.6 but the lens is at T2.8, so the lens is 2 stops more open than normal. That’s N+2.</b></p><p style="margin:0">For takes where scrims go in or out, first check that the grey card’s spot reading changed by the amount you expected. Real scrims aren’t perfect: a “double” can really be ¾ or 1¼ stops. If it’s off, type the real reading on step 7 and that take’s math is corrected.</p>`)}
  ${why('Why half-stops only near N',`<p style="margin:0">The most interesting changes happen within a stop and a half of N: where skin looks best, and where it starts to go wrong. Past ±2 stops you’re only finding the walls, so whole stops are enough.</p>`)}
  ${words(['ladder','rung','N','stop','shutter','fps','scrim','single','tstop','split','dof','spot','meter'])}`;
}

function howText(r,b,p){
  const parts=[];
  if(p.speed){ const d0=360*p.F0/b.A0; if(Math.abs(log2(r.den/d0))>0.02) parts.push((r.den<d0?'slower':'faster')+' shutter speed '+fmtDen(d0)+' → '+fmtDen(r.den)+' ('+stopWord(log2(d0/r.den))+')'); }
  else if(Math.abs(r.angle-b.A0)>0.01) parts.push((r.angle>b.A0?'open':'close')+' the shutter angle '+fmtAng(b.A0)+' → '+fmtAng(r.angle)+' ('+stopWord(log2(r.angle/b.A0))+')');
  if(Math.abs(r.F-p.F0)>EPS) parts.push('frame rate '+fmtFps(p.F0)+' → '+fmtFps(r.F)+' frames per second'+(p.speed?(r.F<p.F0?' (so the shutter can stay open longer)':' (so the shutter can be faster)'):' ('+stopWord(log2(p.F0/r.F))+')'));
  const dD=b.D0-r.D;
  if(dD>0) parts.push('pull out '+dD+' double scrim'+(dD>1?'s':'')+' ('+stopWord(dD)+')');
  if(dD<0) parts.push('add '+(-dD)+' more double scrim'+(dD<-1?'s':'')+' ('+stopWord(dD)+')');
  const dG=b.G0-r.G;
  if(dG>0) parts.push('pull out '+dG+' single scrim'+(dG>1?'s':'')+' ('+stopWord(dG/2)+')');
  if(dG<0) parts.push('add '+(-dG)+' single scrim'+(dG<-1?'s':'')+' ('+stopWord(dG/2)+')');
  const dI=p.sN-r.s;
  if(Math.abs(dI)>EPS) parts.push('⚠︎ '+(dI>0?'open':'close')+' the lens '+fmtStops(Math.abs(dI),false)+' stop'+(Math.abs(Math.abs(dI)-0.5)<EPS?' by setting the ring halfway between two marks':'')+' ('+fmtStops(dI)+')');
  return parts.length?parts.join(' · '):'starting settings — this is N, your normal exposure';
}
function stopWord(x){ return fmtStops(x)+(Math.abs(x)>1+EPS?' stops':' stop'); }
/* How much light a rung gets compared to N, in words a 10th grader can picture */
function mult(o){
  if(Math.abs(o)<0.08) return 'normal exposure';
  const m=Math.pow(2,Math.abs(o)); const n=Math.abs(m-Math.round(m))<0.05?String(Math.round(m)):(Math.round(m*10)/10).toString();
  if(o<0&&n==='2') return 'half the light';
  if(o<0&&n==='4') return 'a quarter of the light';
  return o>0?`${n}× the light`:`1/${n} of the light`;
}
function plainO(o){
  if(Math.abs(o)<0.08) return 'normal exposure';
  return `${fmtStops(Math.abs(o),false)} stop${Math.abs(Math.abs(o)-1)<0.05||Math.abs(o)<1?'':'s'} ${o>0?'brighter':'darker'} · ${mult(o)}`;
}

/* ============================================================
   WORD LIST — every term, explained once, in plain language
   ============================================================ */
const WORDS={
  stop:['Stop','One step of light. +1 stop means twice as much light. −1 stop means half as much. Everything in this test is counted in stops.'],
  N:['N (normal exposure)','The exposure you actually plan to shoot your film at. Every take is named by how far it is from N. N+2 is 2 stops brighter (4× the light). N−1 is 1 stop darker (half the light).'],
  ladder:['Exposure ladder','The same shot recorded 15 times, each one a set number of stops brighter or darker than N, like the rungs of a ladder. Watching where the picture breaks tells you what your camera can handle.'],
  rung:['Rung / take','One recording in the ladder, for example the N+2 take.'],
  tstop:['T-stop','The number on a cinema lens ring that controls how much light gets through. A smaller number (T2) lets in more light and a bigger number (T8) less. Each full mark (1.4, 2, 2.8, 4, 5.6, 8, 11, 16, 22) is exactly one stop apart.'],
  iris:['Iris','The opening inside the lens that you set with the T-stop ring.'],
  split:['Split (half-stop)','Setting the lens ring exactly halfway between two marks, like between T2 and T2.8. That’s half a stop.'],
  dof:['Depth of field','How much of the picture, from front to back, is in sharp focus. Changing the T-stop changes it, which is one reason we keep the lens at N.'],
  shutter:['Shutter angle','How long each frame is exposed, written in degrees. 180° is normal. 360° exposes twice as long (+1 stop) and 90° half as long (−1 stop).'],
  speed:['Shutter speed','The same idea as shutter angle, written as a fraction of a second (1/48). Some cameras use this instead of degrees.'],
  fps:['Frame rate (frames per second, fps)','How many pictures the camera records each second. 24 is normal. Recording 12 per second at the same shutter angle exposes each picture twice as long: +1 stop.'],
  sensorfps:['Sensor frame rate','How many frames the sensor actually captures per second. This is what changes exposure. In slow-motion menus it’s sometimes called “S&Q” (slow and quick) or “off-speed.”'],
  ei:['Exposure Index (EI) / ISO','The sensitivity number you set on the camera and on the meter. They must match. The camera’s “native” or “base” ISO is the setting it was designed around.'],
  rerate:['Re-rating','Choosing a different EI than the native one on purpose, to protect bright areas or dark areas.'],
  tungsten:['Tungsten light','A classic lamp with a glowing metal filament. Its color is warm, about 3200 Kelvin.'],
  single:['Single / double scrim','Scrim bags are color-coded: a double usually has a red rim and cuts about 1 stop. A single usually has a green rim and cuts about ½ stop. Real scrims vary a little, so you check each one with the meter.'],
  scrim:['Scrim','A wire-mesh screen that slides into the front of a light. A double (red rim) cuts about 1 stop and a single (green rim) about ½ stop. Scrims make the light dimmer without changing its color or direction.'],
  dimmer:['Dimmer','Turning the power down. On a tungsten light this makes the light more orange, which adds a second change to the test. We don’t use it.'],
  bead:['Bead board','A white foam board you can bounce light off to make it softer.'],
  solid:['Solid (flag)','A black cloth on a metal frame, set on a stand, that blocks light from hitting part of the set or the lens.'],
  kelvin:['Kelvin (K) / white balance','Kelvin is the color of light. Tungsten is about 3200K. White balance tells the camera that color, so white looks white. We lock it so it can’t change.'],
  meter:['Light meter (Sekonic Speedmaster)','A handheld tool that measures light and tells you which T-stop gives a correct exposure for the settings you type in.'],
  incident:['Dome (incident) reading','Holding the meter at the actor with its white dome pointed at the camera. It measures the light arriving at the actor, no matter what they’re wearing.'],
  spot:['Spot reading','Looking through the meter’s small viewfinder at one surface (skin, a shirt, a wall). It tells you how bright that one surface is.'],
  grey:['Grey card (middle grey)','A card that reflects exactly 18% of the light. It’s the “average” brightness the meter and camera are built around, so it’s our reference.'],
  waveform:['Waveform','A graph on the monitor showing how bright every part of the picture is, from 0 (black) at the bottom to 100 (white) at the top.'],
  ire:['IRE','The units on the waveform’s 0–100 brightness scale. A grey card lit correctly sits around 40–45 IRE.'],
  clip:['Clip / clipping','When something is too bright for the sensor, it records as flat white and the detail is gone forever. On the waveform it looks like a flat line at the top.'],
  noise:['Noise / noise floor','The grainy, crawling speckle in dark areas. The noise floor is the point where shadows turn into nothing but noise.'],
  dr:['Dynamic range','How many stops the sensor can record between clipping and the noise floor. The manufacturer measures this on a test chart.'],
  latitude:['Latitude','How many stops over and under N you can shoot and still fix in color grading. This is what your test measures, and it’s your judgment, so say what standard you used.'],
  profile:['Recording profile','The “look curve” the camera records with. Rec709 looks like normal TV and is ready to watch. Log profiles (S-Log, Canon Log, LogC…) look flat and grey but save more range for color grading.'],
  grade:['Color grading / colorist','Adjusting brightness and color after the shoot. The colorist is the person who does it.'],
  onelight:['One light','One single color correction, set on the N take and copied unchanged onto every take. It shows exactly what the sensor did.'],
  bestlight:['Best light','Each take corrected on its own, as far as it can go. It shows how much you can rescue in grading.'],
  rolloff:['Highlight roll-off','How gently bright areas fade into white. Smooth roll-off looks natural; harsh roll-off looks like a hard cut to white.'],
  variables:['Controlled / independent / dependent','Controlled: things you keep the same. Independent: the one thing you change on purpose. Dependent: what you watch for changes.'],
  slate:['Slate','The board held in front of the camera at the start of each take with the take’s information written on it.'],
  nd:['ND filter (neutral density)','A grey filter that cuts light without changing color. We leave it out so it can’t sneak in as another variable.'],
  roles:['Crew jobs','DP (Director of Photography): leads the camera team and judges the image. 1st AC (First Assistant Camera): sets the lens and camera. 2nd AC (Second Assistant Camera): slates and logs. Gaffer: head of lighting.'],
  ratio:['Lighting ratio','How much brighter the key side of the face is than the fill side. 1 stop brighter = 2:1, 2 stops = 4:1.'],
  keyfill:['Key, fill, hair, background','Key: the main light on the face. Fill: the softer, darker side. Hair or separation: light from behind that outlines the person. Background: the wall or set behind them.'],
  practical:['Practical','A lamp or light source that is visible in the shot.'],
  standin:['Stand-in','A person who sits in for the actor during setup and testing.'],
};
function words(keys){
  return `<details class="words"><summary>Words on this page (${keys.length})</summary><dl>${keys.map(k=>WORDS[k]?`<dt>${esc(WORDS[k][0])}</dt><dd>${esc(WORDS[k][1])}</dd>`:'').join('')}</dl></details>`;
}
function how(title,body){ return `<details class="howto"><summary>${title}</summary><div>${body}</div></details>`; }
function now(doing,whyText,doneWhen){
  return `<div class="now"><span class="label">What are we doing now?</span><p class="doing">${doing}</p><p><b>Why it matters:</b> ${whyText}</p><p style="margin:0"><b>You’re done when:</b> ${doneWhen}</p></div>`;
}

/* ============================================================

const STEPS=[
